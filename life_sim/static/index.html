<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生重演 · 文字版</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Cascadia Mono", Consolas, "Noto Sans Mono CJK SC",
                 "Sarasa Mono SC", monospace;
    font-size: 15px;
    line-height: 1.7;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; color: var(--accent); margin: 8px 0 2px; }
  .sub { color: var(--dim); margin-bottom: 24px; font-size: 13px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 15px; margin: 0 0 10px; color: var(--accent);
    border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  textarea {
    width: 100%; min-height: 220px; resize: vertical;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font: inherit; line-height: 1.7;
  }
  textarea:focus, input:focus, select:focus {
    outline: none; border-color: var(--accent);
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  input, select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; width: 110px;
  }
  button {
    background: #1f6feb; color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; font: inherit; cursor: pointer;
  }
  button:hover { background: #388bfd; }
  button:disabled { background: #30363d; color: var(--dim); cursor: wait; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--dim); font-size: 13px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .bar-label { width: 5.5em; color: var(--dim); flex: none; }
  .bar-track {
    flex: 1; height: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .bar-fill { height: 100%; background: var(--accent); transition: width .6s; }
  .bar-num { width: 2.5em; text-align: right; flex: none; }
  .evidence { color: var(--dim); font-size: 13px; margin: 2px 0 10px 5.5em; }
  .evidence em { color: var(--warn); font-style: normal; }
  .tag {
    display: inline-block; border: 1px solid var(--border); border-radius: 20px;
    padding: 1px 12px; margin: 2px 6px 2px 0; font-size: 13px; color: var(--dim);
  }
  .tag b { color: var(--text); font-weight: normal; }
  #timeline { white-space: pre-wrap; }
  .year-age { color: var(--accent); }
  .turning { color: var(--warn); }
  .death { color: var(--bad); }
  .summary-line { color: var(--good); }
  .error { color: var(--bad); margin-top: 10px; }
  .conf-note { margin-top: 10px; padding: 10px; border-left: 3px solid var(--warn);
               background: var(--bg); font-size: 13px; color: var(--dim); }
  .day-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .day-date { color: var(--accent); font-size: 16px; }
  .day-tag {
    border: 1px solid var(--border); border-radius: 20px;
    padding: 0 10px; font-size: 12px; color: var(--dim);
  }
  .slot { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; }
  .slot-name {
    flex: none; width: 3.2em; color: var(--accent); font-size: 13px;
    padding-top: 2px; opacity: .85;
  }
  .slot-entries { flex: 1; }
  .slot-entries div { margin-bottom: 6px; }
  .slot-entries div:last-child { margin-bottom: 0; }
  .entry-thread { color: var(--warn); }
  .entry-carry { color: var(--dim); font-style: italic; }
  .day-bars { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px;
              padding-top: 12px; border-top: 1px solid var(--border); }
  .day-bar { flex: 1; min-width: 92px; }
  .day-bar-label { font-size: 12px; color: var(--dim); display: flex;
                   justify-content: space-between; }
  .day-bar-track { height: 6px; background: var(--bg); border-radius: 3px;
                   overflow: hidden; margin-top: 3px; }
  .day-bar-fill { height: 100%; transition: width .5s; }
  .day-threads { margin-top: 12px; font-size: 13px; color: var(--dim); }
  .day-threads b { color: var(--warn); font-weight: normal; }
  .log-day { border-left: 2px solid var(--border); padding-left: 10px;
             margin-bottom: 8px; font-size: 13px; color: var(--dim); }
  .log-day b { color: var(--text); font-weight: normal; }
  footer { color: var(--dim); font-size: 12px; margin-top: 40px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>人生重演 · 文字版 <span style="color:var(--dim);font-size:13px">v0.1</span></h1>
  <div class="sub">写下你的人生经历 → 心理学侧写 → 一场符合逻辑的人生模拟。写得越详细，就越像你。</div>

  <div class="panel">
    <h2>① 写下你的经历</h2>
    <textarea id="story" placeholder="用自己的话，讲讲你的人生。

比如：出生年份/年龄、家乡和家庭、上学时是什么样的人、印象最深的几件事、
现在做什么工作、感情经历、让你焦虑或快乐的事情、习惯和爱好……

写得越具体（时间、地点、细节、感受），侧写引擎就越了解你，
模拟出的人生轨迹也越贴近你本人的性格逻辑。"></textarea>
    <div class="row">
      <span class="hint">年龄与性别都会从你的故事里自动识别</span>
      <span class="hint" id="charCount">0 字</span>
    </div>
    <div class="row">
      <button id="btnProfile">生成人物侧写</button>
      <button id="btnSim">开始人生模拟 ▶</button>
      <button id="btnReplay" class="ghost" style="display:none">换一个平行世界重演</button>
      <button id="btnStartDays" class="ghost">逐日模拟 · 一天一天过 ▷</button>
    </div>
    <div id="err" class="error"></div>
  </div>

  <div class="panel" id="profilePanel" style="display:none">
    <h2>② 人物侧写</h2>
    <div id="profileBody"></div>
  </div>

  <div class="panel" id="simPanel" style="display:none">
    <h2>③ 人生模拟</h2>
    <div id="simMeta" class="hint" style="margin-bottom:10px"></div>
    <div id="timeline"></div>
    <div id="summary" style="margin-top:16px"></div>
  </div>

  <div class="panel" id="dayPanel" style="display:none">
    <h2>④ 逐日模拟 <span class="hint" id="dayCounter"></span></h2>
    <div id="dayBody"></div>
    <div class="row" style="margin-top:14px">
      <button id="btnNextDay">生成下一天 ▶</button>
      <button id="btnDayLog" class="ghost">看看前几天</button>
      <button id="btnDayReset" class="ghost">从头开始</button>
    </div>
    <div id="dayLog" style="display:none;margin-top:14px"></div>
  </div>

  <footer>人生重演 Life Replay · 规则引擎 v0.1 · 侧写基于大五人格 / Schwartz 价值观 / 成人依恋理论</footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let seedOffset = 0;

$("story").addEventListener("input", () => {
  $("charCount").textContent = $("story").value.length + " 字";
});

function inputs() {
  return { story: $("story").value };
}

async function call(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ("请求失败 " + res.status));
  return data;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function bar(label, val, evidenceHtml) {
  return `
    <div class="bar-row">
      <span class="bar-label">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${val}%"></div></div>
      <span class="bar-num">${val}</span>
    </div>${evidenceHtml || ""}`;
}

function renderProfile(p) {
  let html = "";
  for (const [dim, score] of Object.entries(p.big_five)) {
    const name = p.big_five_names[dim] || dim;
    const evs = (p.big_five_evidence[dim] || []).slice(0, 3);
    let evHtml = "";
    if (evs.length) {
      const parts = evs.map((e) =>
        `<em>${esc(e.keyword)}</em>(${e.weight > 0 ? "+" : ""}${e.weight}×${e.count})`);
      evHtml = `<div class="evidence">依据: ${parts.join("、 ")}</div>`;
    }
    html += bar(name, score, evHtml);
  }

  html += `<div style="margin-top:14px">`;
  const vals = Object.entries(p.values).sort((a, b) => b[1] - a[1]);
  for (const [k, v] of vals) {
    if (v > 0) html += `<span class="tag">${esc(p.value_names[k])} <b>${v}%</b></span>`;
  }
  html += `<span class="tag">依恋风格 <b>${esc(p.attachment_name)}</b></span>`;
  if (p.age_known) {
    const ev = p.age_evidence ? `「${esc(p.age_evidence)}」` : "";
    html += `<span class="tag">年龄 <b>${p.age}</b> <span style="font-size:11px">`
      + `${esc(p.age_source)}${ev}</span></span>`;
  } else {
    html += `<span class="tag" style="border-color:var(--warn)">年龄 <b>${p.age}</b>`
      + ` <span style="font-size:11px">默认值</span></span>`;
  }
  if (p.gender) html += `<span class="tag">性别 <b>${p.gender === "male" ? "男" : "女"}</b></span>`;
  html += `</div>`;

  if (!p.age_known) {
    html += `<div class="conf-note" style="border-left-color:var(--warn)">`
      + `没能从你的故事里读出年龄，先按 ${p.age} 岁模拟。`
      + `补一句"我今年X岁"或"我是X年生的"，整条人生轨迹会准得多。</div>`;
  } else if (p.age_rejected && p.age_rejected.length) {
    const skipped = p.age_rejected.filter(r => r.age !== null)
      .map(r => `${esc(r.text)}(${esc(r.reason)})`).slice(0, 3);
    if (skipped.length) {
      html += `<div class="evidence" style="margin-left:0">`
        + `· 年龄识别时跳过了：${skipped.join("、 ")}</div>`;
    }
  }
  const factKeys = Object.keys(p.facts || {});
  if (factKeys.length) {
    html += `<div style="margin-top:14px" class="hint">从你的故事里读到的生平线索：</div>`;
    for (const k of factKeys) {
      const lines = p.facts[k].slice(0, 3).map(esc).join(" / ");
      html += `<div class="evidence" style="margin-left:0">· ${esc(p.fact_names[k])}: ${lines}</div>`;
    }
  }

  html += `<div class="conf-note">侧写置信度 <b>${p.confidence}%</b>（细节密度 ${p.detail_score}%，全文 ${p.text_length} 字）。`
    + (p.confidence < 50
       ? "故事还比较简略——补充具体的时间、事件和感受，画像会明显更准。"
       : "细节相当充分，画像已具备较强的个人特征。")
    + `</div>`;

  $("profileBody").innerHTML = html;
  $("profilePanel").style.display = "";
}

function renderSim(sim) {
  const lines = [];
  for (const entry of sim.timeline) {
    for (const ev of entry.events) {
      let cls = "";
      if (ev.includes("终点")) cls = "death";
      else if (sim.turning_points.some((t) => t.endsWith(ev))) cls = "turning";
      lines.push(
        `<span class="year-age">${entry.year} · ${entry.age}岁</span>  ` +
        `<span class="${cls}">${esc(ev)}</span>`);
    }
  }
  $("timeline").innerHTML = lines.join("\n");

  let s = `<div class="summary-line">—— 模拟结束 ——</div>`;
  s += `<div>享年 ${sim.final_age} 岁`
    + (sim.death_cause ? `（${esc(sim.death_cause)}）` : "（模拟至此为止，人还健在）") + `。`
    + `最终身份：${esc(sim.career_final)}；`
    + (sim.married ? "已婚" : "未婚") + `，${sim.children} 个孩子`
    + (sim.owns_home ? "，有自己的房子" : "") + `。`
    + `晚年幸福感 ${sim.final_happiness}/100。</div>`;
  if (sim.turning_points.length) {
    s += `<div style="margin-top:10px" class="hint">人生关键转折点：</div>`;
    for (const t of sim.turning_points) {
      s += `<div class="turning">★ ${esc(t)}</div>`;
    }
  }
  $("summary").innerHTML = s;
  $("simPanel").style.display = "";
  $("btnReplay").style.display = "";
}

async function doProfile() {
  $("err").textContent = "";
  $("btnProfile").disabled = true;
  try {
    const data = await call("/api/profile", inputs());
    renderProfile(data.profile);
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("btnProfile").disabled = false;
  }
}

async function doSim(offset) {
  $("err").textContent = "";
  $("btnSim").disabled = true;
  $("btnReplay").disabled = true;
  try {
    const body = inputs();
    body.seed_offset = offset;
    const data = await call("/api/simulate", body);
    renderProfile(data.profile);
    $("simMeta").textContent = offset === 0
      ? "主世界线（同一段经历总是重演出同一条轨迹）"
      : `平行世界 #${offset}（同样的你，不同的运气）`;
    renderSim(data.simulation);
    $("simPanel").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("btnSim").disabled = false;
    $("btnReplay").disabled = false;
  }
}

$("btnProfile").addEventListener("click", doProfile);
/* ---------------------------- 逐日模拟界面 ---------------------------- */
let dayState = null;
let dayHistory = [];

function barColor(key, val) {
  if (key === "stress") return val > 65 ? "var(--bad)" : val > 45 ? "var(--warn)" : "var(--good)";
  return val < 35 ? "var(--bad)" : val < 60 ? "var(--warn)" : "var(--good)";
}

function renderDay(day) {
  const tags = [day.weather, day.is_rest_day ? "休息日" : "工作日", day.season];
  let html = `<div class="day-head">`
    + `<span class="day-date">${esc(day.date_text)}</span>`
    + tags.map(t => `<span class="day-tag">${esc(t)}</span>`).join("")
    + `</div>`;

  for (const slot of day.slots) {
    html += `<div class="slot"><span class="slot-name">${esc(slot.name)}</span>`
      + `<div class="slot-entries">`
      + slot.entries.map(e => `<div>${esc(e)}</div>`).join("")
      + `</div></div>`;
  }

  const labels = {energy: "精力", mood: "心情", stress: "压力", health: "健康", money: "余钱"};
  html += `<div class="day-bars">`;
  for (const [key, label] of Object.entries(labels)) {
    const v = day.state[key];
    html += `<div class="day-bar"><div class="day-bar-label"><span>${label}</span><span>${v}</span></div>`
      + `<div class="day-bar-track"><div class="day-bar-fill" style="width:${v}%;background:${barColor(key, v)}"></div></div></div>`;
  }
  html += `</div>`;

  if (day.active_threads && day.active_threads.length) {
    html += `<div class="day-threads">进行中：`
      + day.active_threads.map(t =>
          `<b>${esc(t.title)}</b>（${esc(t.stage_name)} ${t.stage}/${t.total}）`).join("　")
      + `</div>`;
  }
  if (day.known_people && day.known_people.length) {
    html += `<div class="day-threads">最近打过交道：`
      + day.known_people.slice(0, 5).map(pp =>
          esc(pp.name) + (pp.days_since > 3 ? `（${pp.days_since}天没见）` : "")).join("、")
      + `</div>`;
  }

  $("dayBody").innerHTML = html;
  $("dayCounter").textContent = `第 ${day.day_index} 天`;
  $("dayPanel").style.display = "";
}

function renderDayLog() {
  if (!dayHistory.length) { $("dayLog").innerHTML = `<span class="hint">还没有记录。</span>`; return; }
  $("dayLog").innerHTML = dayHistory.slice().reverse().map(d =>
    `<div class="log-day"><b>${esc(d.date_text)}</b>　${esc(d.summary || "")}</div>`).join("");
}

function resetDays() {
  dayState = null;
  dayHistory = [];
  $("dayBody").innerHTML = "";
  $("dayLog").style.display = "none";
  $("dayCounter").textContent = "";
  $("btnNextDay").textContent = "生成第一天 ▶";
}

/* 服务器版：每天向后端要一天，状态在前后端之间来回传 */
async function stepDay() {
  const inp = inputs();
  if (!validate(inp.story)) return;
  $("btnNextDay").disabled = true;
  try {
    const body = Object.assign({}, inp);
    if (dayState) body.state = dayState;
    const data = await call("/api/day", body);
    dayState = data.state;
    dayHistory.push({date_text: data.day.date_text, summary: data.day.summary});
    renderDay(data.day);
    $("btnNextDay").textContent = "再过一天 ▶";
    if (dayHistory.length > 1) renderDayLog();
    $("dayPanel").scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("btnNextDay").disabled = false;
  }
}
$("btnStartDays").addEventListener("click", () => { resetDays(); stepDay(); });
$("btnNextDay").addEventListener("click", stepDay);
$("btnDayReset").addEventListener("click", () => { resetDays(); stepDay(); });
$("btnDayLog").addEventListener("click", () => {
  const box = $("dayLog");
  const show = box.style.display === "none";
  box.style.display = show ? "" : "none";
  $("btnDayLog").textContent = show ? "收起记录" : "看看前几天";
  if (show) renderDayLog();
});

$("btnSim").addEventListener("click", () => { seedOffset = 0; doSim(0); });
$("btnReplay").addEventListener("click", () => { seedOffset += 1; doSim(seedOffset); });
</script>
</body>
</html>
