0.7,"trait_bias":{"E":0.3},"effects":{"happiness":4}},{"id":"evt_hm_253","text":"你开始学着做年轻时没时间学的东西，进度很慢，但没人催你。","domain":"growth","min_age":50,"max_age":85,"weight":0.7,"trait_bias":{"O":0.5},"effects":{"happiness":5}},{"id":"evt_hm_254","text":"老同学群里有人发了张几十年前的合影，一下午的消息全是'这是谁来着'。","domain":"social","min_age":45,"max_age":85,"weight":0.7,"effects":{"happiness":4}},{"id":"evt_hm_255","text":"你把家里的老物件一件件擦干净摆好，发现每一件背后都能讲半小时。","domain":"misc","min_age":50,"max_age":90,"weight":0.7,"effects":{"happiness":4}},{"id":"evt_hm_256","text":"你在医院陪家人挂号排队，一整天，最后结果是虚惊一场。","domain":"family","min_age":28,"max_age":70,"weight":0.7,"effects":{"stress":6,"happiness":2}},{"id":"evt_hm_257","text":"你走了一条没走过的路回家，发现绕远了十分钟，但沿途有条很好看的巷子。","domain":"misc","min_age":15,"max_age":75,"weight":0.7,"trait_bias":{"O":0.4},"effects":{"happiness":3}},{"id":"evt_hm_258","text":"你养的宠物生病了，你请了假守了两天。它好起来那天，你比谁都开心。","domain":"misc","min_age":18,"max_age":70,"weight":0.6,"trait_bias":{"A":0.4},"effects":{"happiness":4,"stress":3}},{"id":"evt_hm_259","text":"你在一场大雨里没打伞走了一段路，回家洗了个热水澡，居然觉得很痛快。","domain":"misc","min_age":15,"max_age":55,"weight":0.6,"effects":{"happiness":3}},{"id":"evt_hm_260","text":"你把工位收拾得干干净净，第二天上班时心情莫名好了一点。","domain":"career","min_age":22,"max_age":60,"weight":0.6,"trait_bias":{"C":0.4},"effects":{"happiness":2,"stress":-2}},{"id":"evt_hm_261","text":"你终于把拖了很久的那件事做完了。它没有想象中那么难，只是一直很重。","domain":"growth","min_age":18,"max_age":70,"weight":0.8,"trait_bias":{"C":0.3},"effects":{"happiness":5,"stress":-6}},{"id":"evt_hm_262","text":"你被一首很多年没听过的歌击中，站在原地把它听完了。","domain":"misc","min_age":16,"max_age":80,"weight":0.7,"effects":{"happiness":3}},{"id":"evt_hm_263","text":"你在陌生城市迷了路，问了三个人，得到了三个方向，最后自己走对了。","domain":"misc","min_age":18,"max_age":60,"weight":0.6,"trait_bias":{"O":0.3},"effects":{"happiness":3}}].sort((a, b) => a.id < b.id ? -1 : 1);

/* 氛围事件（"刷到一句话"）的固定占比。语料库里金句有数千条而亲历事件
   只有几百条——用配额而不是权重来控制，语料再涨手感也不变。 */
const AMBIENT_SHARE = 0.22;

function pickWeighted(rng, pool) {
  if (!pool.length) return null;
  const total = pool.reduce((s, p) => s + p.w, 0);
  let r = rng() * total;
  for (const p of pool) {
    r -= p.w;
    if (r <= 0) return p.ev;
  }
  return pool[pool.length - 1].ev;
}

function drawEvent(rng, age, traits) {
  const narrative = [], ambient = [];
  for (const ev of CORPUS) {
    if (!(ev.min_age <= age && age <= ev.max_age)) continue;
    let w = ev.weight || 1;
    for (const [key, bias] of Object.entries(ev.trait_bias || {})) {
      w *= Math.max(0.05, 1 + (traits[key] - 50) / 50 * bias);
    }
    ((ev.kind === "ambient") ? ambient : narrative).push({ev, w});
  }
  const wantAmbient = rng() < AMBIENT_SHARE;
  const primary = wantAmbient ? ambient : narrative;
  const fallback = wantAmbient ? narrative : ambient;
  return pickWeighted(rng, primary) || pickWeighted(rng, fallback);
}

/* ------------- 人生模拟引擎（与 engine/simulation.py 同步） ------------- */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const traitFactor = (score, strength) => Math.max(0.1, 1 + (score - 50) / 10 * strength);

function simulate(profile, seedText, seedOffset) {
  const rng = makeRng(seedText, seedOffset);
  const choose = p => rng() < p;
  const startYear = new Date().getFullYear();
  const b5 = profile.big_five;
  const O = b5.openness, C = b5.conscientiousness, E = b5.extraversion,
        A = b5.agreeableness, N = b5.neuroticism;
  const values = profile.values, attachment = profile.attachment;
  const traits = {O, C, E, A, N};

  const s = {
    age: profile.age, alive: true, deathCause: null,
    education: profile.education_level,
    married: profile.married, children: profile.has_children ? 1 : 0,
    happiness: 60, burnout: 0,
  };
  s.inSchool = s.age < 16 + Math.max(s.education, 1) * 2 && s.age < 28;
  s.career = s.inSchool ? "student" : (profile.entrepreneur ? "entrepreneur" : "employed");
  s.jobLevel = clamp(Math.floor((s.age - 22) / 5), 0, 3);
  s.income = s.inSchool ? 0 : 60 + s.education * 25 + s.jobLevel * 40;
  s.wealth = Math.max(0, (s.age - 22) * 15);
  s.inRelationship = s.married;
  s.health = clamp(95 - Math.max(0, s.age - 30), 40, 100);
  s.stress = 30 + Math.floor(Math.max(0, N - 50) / 2);
  s.ownsHome = s.age > 32 && (values.security || 0) > 20;

  const timeline = [], turningPoints = [];
  function log(year, text, turning) {
    if (!timeline.length || timeline[timeline.length - 1].age !== s.age) {
      timeline.push({year, age: s.age, events: []});
    }
    timeline[timeline.length - 1].events.push(text);
    if (turning) turningPoints.push(s.age + "岁：" + text);
  }

  let year = startYear;
  while (s.alive && s.age < 100 && year - startYear < 100) {
    stepYear(year);
    year++; s.age++;
  }

  function stepYear(year) {
    tickHealth(year);
    if (!s.alive) return;
    if (s.inSchool) tickSchool(year);
    else if (s.career !== "retired") tickCareer(year);
    tickRelationships(year);
    tickFinance(year);
    tickWellbeing(year);
    tickRandom(year);
  }

  function tickHealth(year) {
    const baseDecline = s.age < 40 ? 0.3 : (s.age - 30) * 0.06;
    let decline = baseDecline * traitFactor(100 - C, 0.06) * traitFactor(N, 0.04);
    decline += s.stress * 0.01;
    s.health = clamp(s.health - decline, 0, 100);
    let pDeath = 0.0003 * Math.pow(1.10, Math.max(0, s.age - 30));
    pDeath *= (1.6 - s.health / 100);
    if (choose(pDeath)) {
      s.alive = false;
      s.deathCause = s.age > 55 ? "疾病" : "意外";
      log(year, "生命走到了终点（" + s.deathCause + "）。", true);
      return;
    }
    if (s.health < 35 && choose(0.25)) {
      log(year, "一场大病让你住院了。长期透支的身体发出了警告。", true);
      s.health = clamp(s.health + 10, 0, 100);
      s.stress = clamp(s.stress - 10, 0, 100);
      if (s.career === "employed" && choose(0.3)) log(year, "病后你开始重新审视工作与生活的平衡。");
    }
  }

  function tickSchool(year) {
    const gradAge = 16 + Math.max(s.education, 1) * 2;
    if (s.age >= gradAge || s.age >= 28) {
      s.inSchool = false; s.career = "employed"; s.jobLevel = 0;
      s.income = 60 + s.education * 25;
      log(year, "你完成了学业，正式步入社会。", true);
      if (s.education === 3 && s.age < 24) {
        const pGrad = 0.15 * traitFactor(C, 0.15) * traitFactor(O, 0.10) * (1 + (values.achievement || 0) / 60);
        if (choose(pGrad)) {
          s.education = 4; s.inSchool = true; s.career = "student"; s.income = 0;
          log(year, "凭着高尽责性(" + C + ")和对深造的执念，你决定继续读研。", true);
        }
      }
    } else if (choose(0.3 * traitFactor(O, 0.1))) {
      log(year, "校园里的一年：你在课业之外探索着自己的兴趣。");
    }
  }

  function tickCareer(year) {
    if (s.age >= 62 && s.career !== "retired") {
      s.career = "retired";
      log(year, "你退休了，开始了人生的新阶段。", true);
      return;
    }
    if (s.career === "employed") {
      const pPromo = 0.12 * traitFactor(C, 0.15) * traitFactor(E, 0.06);
      if (s.jobLevel < 5 && choose(pPromo)) {
        s.jobLevel++; s.income = Math.floor(s.income * 1.3);
        log(year, "你升职了（第" + s.jobLevel + "级）。多年的" + (C >= 50 ? "踏实尽责" : "临场发挥") + "让上级看到了你。");
        s.happiness = clamp(s.happiness + 5, 0, 100);
      }
      if (choose(0.03 * traitFactor(100 - C, 0.08))) {
        s.career = "unemployed";
        log(year, "行业波动，你被裁员了。", true);
        s.stress = clamp(s.stress + 20, 0, 100);
        return;
      }
      let pSwitch = 0.06 * traitFactor(O, 0.15) * (1 + (values.self_direction || 0) / 80);
      if (s.stress > 60) pSwitch *= 1.6;
      if (choose(pSwitch)) {
        if (choose(0.3 * traitFactor(O, 0.2))) {
          log(year, "高开放性(" + O + ")让你做出了旁人意外的决定：转行进入一个全新领域。", true);
          s.income = Math.floor(s.income * 0.85);
          s.jobLevel = Math.max(0, s.jobLevel - 1);
        } else {
          s.income = Math.floor(s.income * 1.15);
          log(year, "你跳槽到了一家新公司，薪资上了一个台阶。");
        }
        s.stress = clamp(s.stress - 15, 0, 100);
      }
      const pStartup = 0.015 * traitFactor(O, 0.12) * traitFactor(E, 0.08)
        * (1 + (values.self_direction || 0) / 60) / (1 + (values.security || 0) / 50);
      if (s.wealth > 100 && s.age < 45 && choose(pStartup)) {
        s.career = "entrepreneur"; s.income = Math.floor(s.income * 0.5);
        log(year, "你辞职创业了。对自主的渴望压过了对安稳的留恋。", true);
      }
    } else if (s.career === "unemployed") {
      if (choose(0.55 * traitFactor(C, 0.08) * traitFactor(E, 0.08))) {
        s.career = "employed"; s.income = Math.floor(Math.max(s.income * 0.9, 50));
        log(year, "经过一段低谷，你找到了新工作。");
        s.stress = clamp(s.stress - 15, 0, 100);
      } else {
        log(year, "求职的一年并不顺利，积蓄在慢慢消耗。");
        s.wealth = Math.max(0, s.wealth - 30);
        s.stress = clamp(s.stress + 10, 0, 100);
      }
    } else if (s.career === "entrepreneur") {
      const roll = rng();
      const grind = traitFactor(C, 0.10);
      if (roll < 0.12 * grind) {
        s.income = Math.floor(s.income * 2.2);
        log(year, "创业迎来爆发的一年，业务翻了一番还多。", true);
        s.happiness = clamp(s.happiness + 8, 0, 100);
      } else if (roll > 0.88 / grind) {
        log(year, "创业失败了。你关掉了公司，回到职场。", true);
        s.career = "employed"; s.income = 80 + s.education * 20;
        s.wealth = Math.max(0, s.wealth - 80);
        s.stress = clamp(s.stress + 15, 0, 100);
      } else {
        s.income = Math.floor(s.income * (0.95 + rng() * 0.25));
        log(year, "创业维艰的一年，起起伏伏但还撑着。");
        s.stress = clamp(s.stress + 5, 0, 100);
      }
    }
  }

  function tickRelationships(year) {
    if (!s.inRelationship && s.age >= 18 && s.age <= 70) {
      const peak = Math.max(0, 1 - Math.abs(s.age - 29) / 20);
      let pMeet = 0.18 * peak * traitFactor(E, 0.10);
      if (attachment === "avoidant") pMeet *= 0.55;
      if (choose(pMeet)) {
        s.inRelationship = true;
        log(year, "你在" + (E >= 50 ? "朋友聚会上" : "一个共同的小圈子里") + "遇到了让你心动的人，开始了一段感情。");
        s.happiness = clamp(s.happiness + 8, 0, 100);
      }
    } else if (s.inRelationship && !s.married) {
      let pBreak = 0.15 * traitFactor(N, 0.08) / traitFactor(A, 0.06);
      if (attachment === "anxious") pBreak *= 1.5;
      else if (attachment === "secure") pBreak *= 0.6;
      if (choose(pBreak)) {
        s.inRelationship = false;
        const reason = {anxious: "反复的患得患失最终耗尽了两个人",
                        avoidant: "你始终没能真正敞开自己",
                        secure: "你们和平地发现彼此并不合适"}[attachment];
        log(year, "这段感情结束了——" + reason + "。");
        s.happiness = clamp(s.happiness - 10, 0, 100);
        s.stress = clamp(s.stress + 8, 0, 100);
      } else {
        let pMarry = (s.age >= 24 && s.age <= 38) ? 0.30 : 0.12;
        pMarry *= traitFactor(A, 0.05);
        if (attachment === "secure") pMarry *= 1.3;
        if (choose(pMarry)) {
          s.married = true;
          log(year, "你们结婚了。", true);
          s.happiness = clamp(s.happiness + 12, 0, 100);
        }
      }
    } else if (s.married) {
      let pDiv = 0.02 * traitFactor(N, 0.10) / traitFactor(A, 0.08);
      if (attachment !== "secure") pDiv *= 1.4;
      if (s.stress > 70) pDiv *= 1.5;
      if (choose(pDiv)) {
        s.married = false; s.inRelationship = false;
        log(year, "婚姻走到了尽头，你们离婚了。", true);
        s.happiness = clamp(s.happiness - 15, 0, 100);
        s.wealth = Math.floor(s.wealth * 0.6);
        return;
      }
      if (s.children < 3 && s.age >= 22 && s.age <= 42) {
        const pChild = 0.22 / (1 + s.children) * (1 + (values.benevolence || 0) / 80);
        if (choose(pChild)) {
          s.children++;
          log(year, "你们的第" + s.children + "个孩子出生了。", true);
          s.happiness = clamp(s.happiness + 8, 0, 100);
          s.stress = clamp(s.stress + 8, 0, 100);
        }
      }
    }
  }

  function tickFinance(year) {
    if (s.career === "retired") {
      const pension = Math.floor(s.income * 0.5);
      s.wealth = Math.max(0, s.wealth + pension - (40 + s.children * 2));
      return;
    }
    let saveRate = 0.15 * traitFactor(C, 0.12);
    if ((values.hedonism || 0) > 30) saveRate *= 0.6;
    const spend = 40 + s.children * 15 + (s.ownsHome ? 20 : 30);
    s.wealth = Math.max(0, s.wealth + Math.floor(s.income * saveRate) - Math.max(0, spend - s.income));
    if (!s.ownsHome && s.wealth > 250 && (values.security || 0) > 15 && choose(0.35)) {
      s.ownsHome = true;
      s.wealth = Math.floor(s.wealth * 0.35);
      log(year, "你掏空积蓄付了首付，买下了自己的房子。对安稳的看重让你觉得值得。", true);
      s.happiness = clamp(s.happiness + 6, 0, 100);
    }
  }

  function tickWellbeing(year) {
    let base = 50;
    base += (s.health - 60) * 0.15;
    base += s.married ? 10 : (s.inRelationship ? 4 : -2);
    base += Math.min(s.children, 2) * 2;
    base += (s.income - 100) * 0.03;
    base += s.ownsHome ? 6 : 0;
    base -= s.stress * 0.15;
    base -= (N - 50) * 0.20;
    base += (E - 50) * 0.10;
    if ((values.achievement || 0) > 30 && s.income < 200) base -= 5;
    s.happiness = clamp(Math.floor(s.happiness * 0.6 + base * 0.4), 0, 100);
    s.stress = clamp(s.stress - 5 - Math.floor((C - 50) / 10), 0, 100);
    if ((s.career === "employed" || s.career === "entrepreneur") && s.jobLevel >= 3) {
      s.stress = clamp(s.stress + 5, 0, 100);
    }
    if (N > 62 && s.stress > 55 && s.happiness < 40) {
      s.burnout++;
      if (s.burnout >= 2 && choose(0.4)) {
        log(year, "长期内耗之后，你陷入了一段严重的情绪低谷，开始寻求心理咨询。", true);
        s.stress = clamp(s.stress - 25, 0, 100);
        s.burnout = 0;
      }
    } else s.burnout = 0;
    if ((s.age === 40 || s.age === 45) && O > 60 && s.happiness < 55) {
      log(year, "站在人生中场，你认真问自己：现在的生活是我想要的吗？");
    }
  }

  function tickRandom(year) {
    if (choose(0.30)) {
      const ev = drawEvent(rng, s.age, traits);
      if (ev) {
        log(year, ev.text);
        const fx = ev.effects || {};
        s.happiness = clamp(s.happiness + (fx.happiness || 0), 0, 100);
        s.stress = clamp(s.stress + (fx.stress || 0), 0, 100);
        s.health = clamp(s.health + (fx.health || 0), 0, 100);
        s.wealth = Math.max(0, s.wealth + (fx.wealth || 0));
        return;
      }
    }
    const roll = rng();
    if (roll < 0.02 * traitFactor(E, 0.1)) {
      log(year, "一位老朋友重新回到你的生活里，你们聊了整晚。");
      s.happiness = clamp(s.happiness + 4, 0, 100);
    } else if (roll > 0.985) {
      log(year, "家中长辈离世，你回了一趟老家，想了很多。");
      s.happiness = clamp(s.happiness - 6, 0, 100);
    } else if (roll > 0.5 && roll < 0.52 && O > 55) {
      log(year, "你捡起了一个搁置多年的爱好，久违地感到纯粹的快乐。");
      s.happiness = clamp(s.happiness + 5, 0, 100);
    }
  }

  return {
    final_age: s.age, alive: s.alive, death_cause: s.deathCause,
    career_final: {student: "学生", employed: "上班族", entrepreneur: "创业者",
                   unemployed: "待业", retired: "退休"}[s.career] || s.career,
    married: s.married, children: s.children, owns_home: s.ownsHome,
    wealth: s.wealth, final_happiness: s.happiness,
    timeline, turning_points: turningPoints,
  };
}

/* ---------------------------- 页面交互 ---------------------------- */
const $ = id => document.getElementById(id);
let seedOffset = 0;

$("story").addEventListener("input", () => {
  $("charCount").textContent = $("story").value.length + " 字";
});

function inputs() {
  return {
    story: $("story").value,
    age: parseInt($("age").value, 10) || undefined,
    gender: $("gender").value || undefined,
  };
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
}
function bar(label, val, evidenceHtml) {
  return `<div class="bar-row"><span class="bar-label">${esc(label)}</span>` +
    `<div class="bar-track"><div class="bar-fill" style="width:${val}%"></div></div>` +
    `<span class="bar-num">${val}</span></div>${evidenceHtml || ""}`;
}
function renderProfile(p) {
  let html = "";
  for (const [dim, score] of Object.entries(p.big_five)) {
    const evs = (p.big_five_evidence[dim] || []).slice(0, 3);
    let evHtml = "";
    if (evs.length) {
      const parts = evs.map(e => `<em>${esc(e.keyword)}</em>(${e.weight > 0 ? "+" : ""}${e.weight}×${e.count})`);
      evHtml = `<div class="evidence">依据: ${parts.join("、 ")}</div>`;
    }
    html += bar(p.big_five_names[dim] || dim, score, evHtml);
  }
  html += `<div style="margin-top:14px">`;
  for (const [k, v] of Object.entries(p.values).sort((a, b) => b[1] - a[1])) {
    if (v > 0) html += `<span class="tag">${esc(p.value_names[k])} <b>${v}%</b></span>`;
  }
  html += `<span class="tag">依恋风格 <b>${esc(p.attachment_name)}</b></span>`;
  html += `<span class="tag">年龄 <b>${p.age}</b> <span style="font-size:11px">(${esc(p.age_source)})</span></span>`;
  if (p.gender) html += `<span class="tag">性别 <b>${p.gender === "male" ? "男" : "女"}</b></span>`;
  html += `</div>`;
  const factKeys = Object.keys(p.facts || {});
  if (factKeys.length) {
    html += `<div style="margin-top:14px" class="hint">从你的故事里读到的生平线索：</div>`;
    for (const k of factKeys) {
      html += `<div class="evidence" style="margin-left:0">· ${esc(p.fact_names[k])}: ${p.facts[k].slice(0, 3).map(esc).join(" / ")}</div>`;
    }
  }
  html += `<div class="conf-note">侧写置信度 <b>${p.confidence}%</b>（细节密度 ${p.detail_score}%，全文 ${p.text_length} 字）。` +
    (p.confidence < 50 ? "故事还比较简略——补充具体的时间、事件和感受，画像会明显更准。"
                       : "细节相当充分，画像已具备较强的个人特征。") + `</div>`;
  $("profileBody").innerHTML = html;
  $("profilePanel").style.display = "";
}
function renderSim(sim) {
  const lines = [];
  for (const entry of sim.timeline) {
    for (const ev of entry.events) {
      let cls = "";
      if (ev.includes("终点")) cls = "death";
      else if (sim.turning_points.some(t => t.endsWith(ev))) cls = "turning";
      lines.push(`<span class="year-age">${entry.year} · ${entry.age}岁</span>  <span class="${cls}">${esc(ev)}</span>`);
    }
  }
  $("timeline").innerHTML = lines.join("\n");
  let out = `<div class="summary-line">—— 模拟结束 ——</div>`;
  out += `<div>享年 ${sim.final_age} 岁` +
    (sim.death_cause ? `（${esc(sim.death_cause)}）` : "（模拟至此为止，人还健在）") + `。` +
    `最终身份：${esc(sim.career_final)}；` + (sim.married ? "已婚" : "未婚") +
    `，${sim.children} 个孩子` + (sim.owns_home ? "，有自己的房子" : "") + `。` +
    `晚年幸福感 ${sim.final_happiness}/100。</div>`;
  if (sim.turning_points.length) {
    out += `<div style="margin-top:10px" class="hint">人生关键转折点：</div>`;
    for (const t of sim.turning_points) out += `<div class="turning">★ ${esc(t)}</div>`;
  }
  $("summary").innerHTML = out;
  $("simPanel").style.display = "";
  $("btnReplay").style.display = "";
}
function validate(story) {
  if (story.trim().length < 30) {
    $("err").textContent = "请至少写 30 个字的人生经历——写得越详细，模拟越像你。";
    return false;
  }
  $("err").textContent = "";
  return true;
}
$("btnProfile").addEventListener("click", () => {
  const inp = inputs();
  if (!validate(inp.story)) return;
  renderProfile(buildProfile(inp.story, inp));
});
function runSim(offset) {
  const inp = inputs();
  if (!validate(inp.story)) return;
  const profile = buildProfile(inp.story, inp);
  renderProfile(profile);
  $("simMeta").textContent = offset === 0
    ? "主世界线（同一段经历总是重演出同一条轨迹）"
    : `平行世界 #${offset}（同样的你，不同的运气）`;
  renderSim(simulate(profile, inp.story, offset));
  $("simPanel").scrollIntoView({behavior: "smooth"});
}
$("btnSim").addEventListener("click", () => { seedOffset = 0; runSim(0); });
$("btnReplay").addEventListener("click", () => { seedOffset++; runSim(seedOffset); });
</script>
