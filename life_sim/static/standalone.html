function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}
function sfc32(a, b, c, d) {
  return function () {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;

    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

function splitSentences(text) {
  return text.split(/[。！？!?\n;；]+/).map(s => s.trim()).filter(Boolean);
}
function countOccurrences(haystack, needle) {
  if (!needle) return 0;
  let count = 0, pos = 0;
  while ((pos = haystack.indexOf(needle, pos)) !== -1) { count++; pos += needle.length; }
  return count;
}
function scan(text, sentences, table) {
  const lowered = text.toLowerCase();
  let score = 0;
  const evidence = [];
  for (const [keyword, weight] of Object.entries(table)) {
    const count = countOccurrences(lowered, keyword.toLowerCase());
    if (count <= 0) continue;
    score += weight * Math.sqrt(count);
    let source = "";
    for (const sent of sentences) {
      if (sent.toLowerCase().includes(keyword.toLowerCase())) { source = sent.slice(0, 60); break; }
    }
    evidence.push({keyword, weight: Math.round(weight * 100) / 100, count, sentence: source});
  }
  evidence.sort((a, b) => Math.abs(b.weight) * b.count - Math.abs(a.weight) * a.count);
  return [score, evidence];
}

  const squashed = Math.tanh(raw / 8);
  const reliability = Math.pow(Math.min(1, textLen / 200), 0.5);
  return Math.round(50 + squashed * 45 * reliability);
}

  if (!gender) for (const [pat, g] of GENDER_HINTS) { if (pat.test(text)) { gender = g; break; } }

  let eduLevel = 1;
  for (const [keyword, rank] of EDU_RANK) { if (text.includes(keyword)) { eduLevel = rank; break; } }

  const numbers = (text.match(/\d+/g) || []).length;
  const years = (text.match(/(?:19|20)\d{2}/g) || []).length;
  const markers = ["那年","那天","后来","因为","所以","记得","当时","第一次"].reduce((s, w) => s + countOccurrences(text, w), 0);
  const detail = Math.round(Math.min(textLen / 800, 1) * 50 + Math.min(numbers / 10, 1) * 20 + Math.min(years / 4, 1) * 15 + Math.min(markers / 8, 1) * 15);
  const evidenceCount = Object.values(bigFiveEvidence).reduce((s, v) => s + v.length, 0);
  const confidence = Math.round(detail * 0.6 + Math.min(evidenceCount / 25, 1) * 40);

  return {
    big_five: bigFive, big_five_names: BIG_FIVE_NAMES, big_five_evidence: bigFiveEvidence,
    values, value_names: VALUE_NAMES,
    attachment: bestStyle, attachment_name: ATTACHMENT_NAMES[bestStyle],
    facts, fact_names: FACT_NAMES,
    age, age_source: ageSource, gender,
    education_level: eduLevel,
    married: ["结婚","老婆","妻子","老公","丈夫"].some(k => text.includes(k)) && !text.includes("离婚"),
    has_children: ["女儿","儿子","孩子上","我的孩子"].some(k => text.includes(k)),
    entrepreneur: text.includes("创业"),
    detail_score: detail, confidence, text_length: textLen,
  };
}

text":"你在旧笔记本的扉页看到自己抄过的一句话：「雪落的时候，谁还会注意满是阴霾的天空呢」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0f9c722860b3","text":"深夜的评论区里，一句话停住了你的拇指：「人间没有单纯的快乐，快乐总夹带着烦恼和忧虑」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fa297a57a70","text":"深夜的评论区里，一句话停住了你的拇指：「可以嘲笑你的朋友，但不能嘲笑他喜欢的东西」。","domain":"social","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fa589060dfe","text":"你刷到一条陌生人的留言：「把自己当傻瓜，不懂就问，你会学的更多」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fb1423395ca","text":"歌单随机到一首老歌，热评第一写着：「人为什么要努力？因为怕有朝一日，普通的我，遇见特别的你」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fb30a45afcf","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「力所能及的帮助他人是我们做人的本分，刻意的那么做就超出了我们的能力范畴，说不定还会引来恶意的猜想」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fb380f0544f","text":"你刷到一条陌生人的留言：「你所做的一切，都是在重复昨天」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fb8a3dd7377","text":"歌单随机到一首老歌，热评第一写着：「小舟从此逝，江海寄余生」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fbee6eab823","text":"歌单随机到一首老歌，热评第一写着：「人最强大的武器，是习惯和信赖」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fc0b6394c59","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「流光驰骤追梦魂，江声叠作青春」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_0fc15d12ab48","text":"朋友转发来一句话：「不要把你所遭遇的苦难看得太大，更不要把你所拥有的幸福看得太少」。你回了个表情，心 6,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_107ec849d502","text":"朋友转发来一句话：「酋长露出一副令人惊异的鄙夷神情，观望着这一场发疯似的争吵生活在天涯海角的每一个自然之子都会对这些文明人感到诧异。一小撮黄色的金属，在这些文明人看来，竟比他们的文明所取得的一切精神上和技术上的成就还要有价值」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_108a4a16b01a","text":"歌单随机到一首老歌，热评第一写着：「祝愿每日会有太阳为你升起，把你当做诗的最后一行」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10931b66919a","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「你无法同时拥有青春和对青春的感受」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_109a33a1f69f","text":"深夜的评论区里，一句话停住了你的拇指：「要永远宽恕一切人，要无数次地宽恕别人，因为世界上没有一个人是无罪的，没有一个人不需要宽恕，因此也就没有一个人有权力去惩罚或者纠正别人」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10b1386941c3","text":"你在旧笔记本的扉页看到自己抄过的一句话：「墓碑下是我们的小宝贝，他既不哭也不闹，只活了二十一天 ，花掉我们四十块钱。他来到这世上，四处看了看，不太满意，就回去了」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_10b33730ddb9","text":"你刷到一条陌生人的留言：「我只是卖伞的人，不想做慈悲的神」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10bebde3ae27","text":"歌单随机到一首老歌，热评第一写着：「怎样用\"好寂寞\"，来表现我深深的伤口呢」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10c9b6833206","text":"你刷到一条陌生人的留言：「别等待，趁现在，迈向未来」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10ca92a51d25","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「有些面具戴的太久，就摘不下来了」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10d6688f2964","text":"你刷到一条陌生人的留言：「为了理想的实现，航行的孤独在所难免」，恍惚间想到了自己的生活。","domain":"social","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_10e5b8428508","text":"歌单随机到一首老歌，热评第一写着：「人不能知道自己不知道什么，当他知道自己不知道的时候，他就已经知道了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_10f66f5a2d8f","text":"你刷到一条陌生人的留言：「为什么我明明什么坏事都没有做，却要被那样看待」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1112a13e76af","text":"你刷到一条陌生人的留言：「我们的征途是星辰大海」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_112cbf192b37","text":"你在旧笔记本的扉页看到自己抄过的一句话：「他乡纵有当头月，不及故乡一盏灯」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_114ab0cf76ad","text":"歌单随机到一首老歌，热评第一写着：「不要胆怯，如果有死者与你擦肩而过，同们，平静地对视吧，无数人的忧伤，使你与众不同」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1160bbd2b9d6","text":"深夜的评论区里，一句话停住了你的拇指：「人生没有白走的路，每走一步都算数」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_116bf4f23923","text":"朋友转发来一句话：「故事的结尾，我在那里藏了一个秘密，我依旧爱着这个世界，这件事，希望你们永远都不要提起」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1192fb448869","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「暴秦朘削民众，陈吴揭竿张楚。天家震以威怒，苍生馈之无穷」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11a091f36fdd","text":"歌单随机到一首老歌，热评第一写着：「这些突兀地出现在荒野中的草棚麦垛，绊住了风的腿，扯住了风的衣裳，缠住了风的头发，让它追不上前面的风。她撕扯，哭喊。喊得满天地都是风声」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_11a1c8b6bc6d","text":"歌单随机到一首老歌，热评第一写着：「持道而修，不可议其」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11ad51e27867","text":"你在旧笔记本的扉页看到自己抄过的一句话：「花草落地生根，它有选择么」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11c95d9eeedb","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「世界是你们的，也是我们的，但是归根结底是你们的。你们青年人朝气蓬勃，正在兴旺时期，好像早晨八九点钟的太阳。希望寄托在你们身上」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11d9a6259c27","text":"歌单随机到一首老歌，热评第一写着：「无人与我立黄昏，无人问我粥可温。 无人与我捻熄灯，无人共我书半生。 无人陪我夜已深，无人与我把酒分。 无人拭我相思痕，无人梦我与前尘。 无人陪我顾星辰，无人醒我茶已冷。 无人听我述衷诚，无人解我心头梦。 无人伴我聆此声，无人愁我独行程。 回首向来萧瑟处，无人等在灯火阑珊处」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11dc2a561fa7","text":"朋友转发来一句话：「你看这个碗他又大又圆」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11df0e5f647e","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「我将融入剧烈争斗的大人世界，要在那边孤军奋战，必须变得比任何人都坚不可摧」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11ff756e46f4","text":"你刷到一条陌生人的留言：「一觉醒来以为我长高了，起来一看原来是我被子盖横了」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_11ff997f58a6","text":"深夜的评论区里，一句话停住了你的拇指：「非痴非嗔，却应谶」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_121acc19239d","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「若今后没有炬火，你便是唯一的光」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_121ef95a6d0e","text":"朋友转发来一句话：「听闻那有个神仙，能撒豆成兵，一开始我还不信嘞，直到那个神仙把豆子撒在我的碗里，然后，我成了他的兵」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12398f44a117","text":"歌单随机到一首老歌，热评第一写着：「蹀躞闲鹤游野路，观朝露，拂晓雾。江流无声，风乱庭前树。淫雨绵绵拨花簇，不胜数，落花处。纵横涕泪迟暮书，载清酤，酌锱铢。云散半晌，月染离人目。清梦悠悠伤睹物，舴艋舟，谁人渡」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1250492bb51e","text":"深夜的评论区里，一句话停住了你的拇指：「并非只有能毁掉你的才值得敬畏」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_125a62d76e5d","text":"歌单随机到一首老歌，热评第一写着：「上帝是个无耻的老赌徒，他抛弃了我们」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_126856398a6e","text":"你在旧笔记本的扉页看到自己抄过的一句话：「直到遇到你的那天我才信缘妙不可言，直到分别那天我才知道这个世界上真的存在有缘无分」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12700fe81ffe","text":"你刷到一条陌生人的留言：「世界灿烂盛大，欢迎回家」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1276702f1bc3","text":"朋友转发来一句话：「你是唯一一个醒过来就把梦里的事情忘得一干二净的男人」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1279a11984c3","text":"朋友转发来一句话：「十年聚首，心底执念，听雷声响在南北天堑」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1287c232cc12","text":"你在旧笔记本的扉页看到自己抄过的一句话：「落日沉溺于橘色的海，晚风沦陷于赤诚的爱」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12989fac3493","text":"朋友转发来一句话：「诚然，个人在这个时代已无法完全做到孤立化、原子化的绝对状态」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12a6c9182b19","text":"朋友转发来一句话：「不必担心失去的东西，因为你最终拥有的会遇见你，即使那不是你等待的」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12b4bf65c2b2","text":"朋友转发来一句话：「跟喜欢的人是做不了朋友的，距离远近都是折磨」。你回了个表情，心里却记下了。","domain":"romance","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12b5c6149b4d","text":"你在旧笔记本的扉页看到自己抄过的一句话：「很多事只是最初看起来有意义，但经过多次重复就慢慢失去了意义」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12b8b4bdaf1c","text":"你在旧笔记本的扉页看到自己抄过的一句话：「水赤着脚走在潮湿的街上；树叶，像病人般，抱怨那树」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12ce04c2aa3e","text":"歌单随机到一首老歌，热评第一写着：「这次我终于解脱，等到了这一刻」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_12cfaff37b60","text":"你在旧笔记本的扉页看到自己抄过的一句话：「草原大得孤独，白云美得忧愁，我不知道是不是碰到了最好的马，也许我还没有走遍草原」，已经想不起是什么时候抄的了。","domain":"social","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_12f77ca30b71","text":"你在旧笔记本的扉页看到自己抄过的一句话：「我是个特别害怕失败的人，为此错过了好多事」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_12feb1f35b38","text":"深夜的评论区里，一句话停住了你的拇指：「我知道，时间也许会把我们分开。因此，我把你装进了我的心中。这样，我就无惧时间的洗礼了」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1308b92a3698","text":"朋友转发来一句话：「谁也不再拥有温暖的温度，来焐热那一片彻骨的寒」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":3,"stress":-2}},{"id":"evt_13157ac021cd","text":"你刷到一条陌生人的留言：「他笨了一辈子，就聪明了这么一次」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_13326a2d8d99","text":"你刷到一条陌生人的留言：「列星随行，日月递炤，四时代御，阴阳大化，风雨博施，万物各得其和以生，各得其养以成」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_133a90a840b3","text":"深夜的评论区里，一句话停住了你的拇指：「爱可以穿透时间与空间！堪比万有引力」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_133d8796af1c","text":"歌单随机到一首老歌，热评第一写着：「你的人生是一条漫长的旅途，期间会有人来，也会有人走」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_13438699e9bc","text":"歌单随机到一首老歌，热评第一写着：「来去无常，得过且过」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_134399a1ab80","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「离歌且莫翻新阕，一曲能教肠寸结。直须看尽洛城花，始共春风容易别」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_134659c35441","text":"你在旧笔记本的扉页看到自己抄过的一句话：「只要我足够穷，就没有什么能够诱惑我」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_134c01b1f123","text":"歌单随机到一首老歌，热评第一写着：「他们不知道我们是怎样想他们怎样想我们怎样想他们怎样想我们怎样」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_13658a5696c0","text":"你刷到一条陌生人的留言：「无数少年蜷缩在火车里，却幻想拥抱全世界」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_13a00440a727","text":"深夜的评论区里，一句话停住了你的拇指：「日高悬风拂面留下丝丝温暖，别辜负眼前季节」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":3,"stress":-2}},{"id":"evt_13b16cee6ea9","text":"你在旧笔记本的扉页看到自己抄过的一句话：「最渺小的人常关注着成绩和荣耀；最伟大的人常沉浸于创造和劳动」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_13c4a9414045","text":"你在旧笔记本的扉页看到自己抄过的一句话：「正如彼梦会醒来一般，此梦也 _age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_179a08527fcb","text":"深夜的评论区里，一句话停住了你的拇指：「你搅散一池星光成为我的月亮」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17a501b72d6a","text":"朋友转发来一句话：「记忆是一条早已干涸的河流，只在毫无生气的河床中剩下零落的砾石」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17a8c3f79cc1","text":"你在旧笔记本的扉页看到自己抄过的一句话：「幸亏时光不会倒流，否则万物一定会朝旧岁月里疾步奔跑」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17aa111adb87","text":"你刷到一条陌生人的留言：「你站在高处，就少往下看」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17cf44a3a5d6","text":"你在旧笔记本的扉页看到自己抄过的一句话：「Something……for nothing！用什么珍贵的东西，换回了空白」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17d248625267","text":"你在旧笔记本的扉页看到自己抄过的一句话：「我只是五行缺驱动程序，别说我怠惰」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17d58e7b64e7","text":"歌单随机到一首老歌，热评第一写着：「听了一些日音，想学日语，想去日本，想参加一次烟火大会，哪怕始终是自己一个人努力，也想完成这一切」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17d962cf882d","text":"朋友转发来一句话：「我只想知道，我会倒在离终点多远的地方」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17e10b156426","text":"歌单随机到一首老歌，热评第一写着：「千秋无绝色，悦目为佳人」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_17e18c260813","text":"歌单随机到一首老歌，热评第一写着：「太阳落山并不代表他输了，而是他来了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5," 831622b01b","text":"歌单随机到一首老歌，热评第一写着：「流水长月，依恋不舍。拾栀雨落，忆梦汐潮。思向呼唤，尔已忘期。汝之憨态，流连忘返」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_189d6092da8e","text":"朋友转发来一句话：「绝望的人没有故乡」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_18b7bea0c52c","text":"歌单随机到一首老歌，热评第一写着：「暗恋不会窥见天光，青梅抵不过天降，永远没有旧情复燃破镜重圆」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_18bb23bc47a5","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「我是神里绫华的狗」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_18c40080a657","text":"朋友转发来一句话：「如果你在看，我就是你的风景。如果你在听，我该有多幸运」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_18ccab4bcc15","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「不努力，怎么对的起你的喜欢呢」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_18e7d4c770f0","text":"深夜的评论区里，一句话停住了你的拇指：「太空像一面放大镜，可以在瞬间把人类的阴暗面放到最大……当人类真正流落太空时，集权只需五分钟」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_18f072aca5db","text":"深夜的评论区里，一句话停住了你的拇指：「不是他，变成他」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_18f6607b4e4f","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「我们总喜欢拿顺其自然来敷衍人生路上的荆棘坎坷，却很少承认，真正的顺其自然是竭尽所能之后的不强求，而非两手一摊的不作为」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_190382cb74f2","text":"朋友转发来一句话：「装在各自的才能里像穿了制服，每一位诗人的级别总一目了然」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_190a235cd3dd","text":"你在旧笔记本的扉页看到自己抄过的一句话：「你知道吗，有些人，会以各种你情愿或者不情愿的方式，留在你的记忆里，比如我」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_191578da7275","text":"歌单随机到一首老歌，热评第一写着：「一本书上每多一个公式，就会减少一半读者」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1915f4a616e3","text":"你在旧笔记本的扉页看到自己抄过的一句话：「我想抬头暖阳春草，你给我简单拥抱」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_19161a796763","text":"深夜的评论区里，一句话停住了你的拇指：「你得到什么东西，必然就会失去什么东西。如果你觉得你什么都没有失去，那可能仅仅是你觉得」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_191787c0e2ad","text":"深夜的评论区里，一句话停住了你的拇指：「兰花，是随风而动，却弯曲下垂，虽是晶莹剔透，但也是撑霆裂月，终有一天会污浊色腥，很像那个折了翼的天使」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1919f83979e1","text":"朋友转发来一句话：「勇者愤怒，抽刃向更强者；怯者愤怒，却抽刃向更弱者」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_192213a93ed0","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「别让生活蹂躏了你眉间的温柔」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_19302a975d45","text":"深夜的评论区里，一句话停住了你的拇指：「我们执着于模糊的现在，迷茫于陌生的未来，却从未曾发觉，耳边那一阵灿烂的微风」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_193cc42ddd5e","text":"你刷到一条陌生人的留言：「一见如故，生万千欢喜心」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1944120f8135","text":"朋友转发来一句话：「夷陵老祖，五文一张，十文三张」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_195986437338","text":"你刷到 ient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c160882d2ba","text":"歌单随机到一首老歌，热评第一写着：「我已经很乖了，自己把全部的委屈和心酸都宣泄在黑夜里」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_1c1d712b38a7","text":"朋友转发来一句话：「你睁开眼睛的时候，我在这里」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c1de152cbea","text":"深夜的评论区里，一句话停住了你的拇指：「望如常，而非平常；知彼此，而非如此」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c2b9bcdf3b4","text":"你刷到一条陌生人的留言：「即使被人记恨 只要各位安好 抛弃一切便好」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c2cc56bed1c","text":"歌单随机到一首老歌，热评第一写着：「史密斯永远地躺在了那个暗无天日曾被他当作家的防空洞中」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c3e380489da","text":"你在旧笔记本的扉页看到自己抄过的一句话：「绘守御之明信兮，书香随之丰年」，已经想不起是什么时候抄的了。","domain":"growth","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c3f75a8d830","text":"你刷到一条陌生人的留言：「他们心里都清楚，这件事永远都过不去。所有的话语都是敷衍和欺骗，他们彻底地失去了那个笑得像个傻子似的小孩」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c61913a6c59","text":"歌单随机到一首老歌，热评第一写着：「人类的智慧就如同孔雀的羽毛。极尽炫耀，只是为了吸引异性」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c8ab271c005","text":"你在旧笔记本的扉页看到自己抄过的一句话：「May there be enough clouds in your life to make a beautiful sunset」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1c8d2fb7896a","text":"朋友转发来一句话：「纵深于黑夜之中化作黎明」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight": 鲜衣」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f3e577d2788","text":"歌单随机到一首老歌，热评第一写着：「我们嘲笑过少年的无知，也嘲笑过岁月的苍老。我们行走在路上，理想宏大，眼窝却浅显」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f3fcb53200f","text":"你在旧笔记本的扉页看到自己抄过的一句话：「我有一剑，可搬山，断江，倒海，降妖，镇魔，敕神，摘星，摧城，开天」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f59eb277ece","text":"歌单随机到一首老歌，热评第一写着：「年少时，为了给你一块糖，我给遍了全班。为了探这家店，我探完了所有的店」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f6d5f16c84a","text":"朋友转发来一句话：「有人戳你脊梁，有人爱你荒唐」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f6edee08bb9","text":"你刷到一条陌生人的留言：「失落至极致，是虚无」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f72b753e25c","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「窗外花火亮起的瞬间，我为何在流泪」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f960155e3a5","text":"你在旧笔记本的扉页看到自己抄过的一句话：「搞怪的不是红绿灯，而是我数不清的犹豫」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f961482eb8f","text":"歌单随机到一首老歌，热评第一写着：「努力没用的话，那谁还能区分天才」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1f9ef70e7754","text":"深夜的评论区里，一句话停住了你的拇指：「让时光静静悄悄的流，把所有遗憾和失落都带走」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fb3515c7b42","text":"深夜的评论区里，一句话停住了你的拇指：「——什么是孤独？——心里明明空荡荡的，却什么也装不下」。","domain":"social","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_1fba5497c425","text":"朋友转发来一句话：「往前走，往前看，哪怕前途一片迷惘，哪怕只是凭着惯性继续往前走——总有一天，会在自己漫长的脚印中找到方向」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fc2aa97269b","text":"你刷到一条陌生人的留言：「不能因为第一次飞翔遇到了乌云风暴，从此就怀疑有蓝天彩霞。我们应当正视现实，不必以海市蜃楼里的绿洲，去覆盖地上的沙漠」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fc6ebfd6e8c","text":"朋友转发来一句话：「骑在人民头上的，人民把他摔垮；给人民作牛马的，人民永远记住他！把名字刻入石头的，名字比尸首烂得更早；只要春风吹到的地方，到处是青青的野草」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fdff744e8c1","text":"深夜的评论区里，一句话停住了你的拇指：「真正要分开的两个人，连“分手”二字都是多余的，因为殊途同归」。","domain":"romance","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fe2103370d3","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「你永远也看不到我最寂寞时候的样子，因为只有你不在我身边的时候，我才最寂寞」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fe5e686f02c","text":"歌单随机到一首老歌，热评第一写着：「多少岁月与轻狂交织的梦，被遗忘在大海的尽头，随时光匆匆流去」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_1fef938750e3","text":"深夜的评论区里，一句话停住了你的拇指：「闭上你的深邃双眼。那里夜色飘散」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_201827acaf43","text":"深夜的评论区里，一句话停住了你的拇指：「不知为向，明明想和你说话，却骗你说，风雨正好，该去写点诗句」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2032ffff3ae1","text":"深夜的评论区里，一句话停住了你的拇指：「我们赞叹青春好，又用余生去证明：最贵的那一天，永远是“当时只道是寻常”」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2042a14b ient","effects":{"happiness":0,"stress":1}},{"id":"evt_27675fa1ee11","text":"朋友转发来一句话：「只有在生活用铁环紧紧把你箍起来的时候，坚强才是光荣的东西」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2778d2b3532d","text":"深夜的评论区里，一句话停住了你的拇指：「不要祈求生活公平，只需要适应它」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_277c641e8048","text":"朋友转发来一句话：「别的禅，我都不修。独你是我的禅，秀色可餐」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_27966e1701dd","text":"朋友转发来一句话：「做不了天才，那就努力成为人才吧」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_27a22a614f2e","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「我们生来平凡，那便做一朵洁白的栀子，经过之处，皆留芬芳」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_27baaf057b26","text":"你在旧笔记本的扉页看到自己抄过的一句话：「因为痛苦太有价值，因为回忆太珍贵，所以我们更要继续往前走」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_27bfe29f3814","text":"你在旧笔记本的扉页看到自己抄过的一句话：「我不敢去，但必须去，有些事是必须要做的逃避不了」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_27c7589eddf8","text":"歌单随机到一首老歌，热评第一写着：「这世界如此寂静，是因为我一直在等你的声音」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_27d56b7707d2","text":"朋友转发来一句话：「先别说话，再别康桥」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_27e524acbbad","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「这些悄悄抽出小绿芽的幼苗，终将有一天会长成参天大树吧」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id "你刷到一条陌生人的留言：「青木披山岚，绿漪漾水河」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2bfe4cbcb0d5","text":"你刷到一条陌生人的留言：「知道是一个陷阱的诱惑，但偏偏乐于陷入其中，归根到底还是欲望的作祟」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c17b3085af7","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「労働者の命は何よりも大切です」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c1885c6bd3b","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「偏执于有用的细节，偏执于无用的细节，偏执于甚至不会被发现是有用还是无用的细节，这就是工匠精神」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c26b884c37a","text":"歌单随机到一首老歌，热评第一写着：「十年信奥一场空，不开long long见祖宗」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c2e8f7726a1","text":"歌单随机到一首老歌，热评第一写着：「地图上，指尖微动便可跨越万里，如果回家如这般容易，又岂会有乡愁记叙」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c31f5636d57","text":"你在旧笔记本的扉页看到自己抄过的一句话：「追逐了百年的太阳，却忘了月亮也是独一无二了的」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c37823fbf29","text":"你在旧笔记本的扉页看到自己抄过的一句话：「想君眉眼起轻尘」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c3c6a19097d","text":"你刷到一条陌生人的留言：「他们只是想保护自己的灵魂，结果，雪穗从不以真面目示人，亮司则至今仍在黑暗的通风管中徘徊」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c4c2b0887e8","text":"你在旧笔记本的扉页看到自己抄过的一句话：「可是啊，儿时坚定而稚嫩的梦，终究没能挺过青春的风」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c4fdf671a1d","text":"朋友转发来一句话：「很多事情犹如天气，慢慢热或是渐渐冷，等到惊悟的时候，已过了一季」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c591871cbc4","text":"你刷到一条陌生人的留言：「都是同龄人，我本来没想降维打击」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c6ef107d93f","text":"深夜的评论区里，一句话停住了你的拇指：「永远不要放弃你真正想要得到的东西，等待虽难，但后悔更甚」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_2c759489fa90","text":"深夜的评论区里，一句话停住了你的拇指：「眼睛是心灵的窗户」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2c7e55bc0944","text":"你刷到一条陌生人的留言：「如果到了一个遥远陌生的国度，还不去改变或者推翻自己的曾经，那这远走高飞还有什么飞头」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2cbe99602ee7","text":"你刷到一条陌生人的留言：「给予的希望不要让其轻易破灭。毕竟没到最后，一切都还在进行中。而，结束在什么时刻，谁又说的定。若放弃了，那才是真正结束」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2cc4d4ed93fb","text":"朋友转发来一句话：「我从不相信这世界上有什么天赋异禀。那些看起来超乎寻常的人，总有你没看到的一面」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2cd73aaa8746","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「所有的偶然，不过是想要遇见你」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2ce04b8ace59","text":"朋友转发来一句话：「被风吹散的思念，卷起不羁的时间」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2ce674b38ec1","text":"朋友转发来一句话：「游心于淡，合气于漠，顺物自然而无容私焉」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2cf48d528c72","text":"你在旧笔记本的扉页看到自己抄过的一句话：「我希望庆国之民，有真理可循，知礼仪，守仁心，不以钱财论成败，不因权势而屈从，同情弱小，痛恨不平，危难时坚心志，无人处常自省；我希望这世间，再无压迫束缚，凡生于世，都能有活着的权利，有自由的权利，亦有幸福的权利」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":3,"stress":-2}},{"id":"evt_2cf6434feede","text":"深夜的评论区里，一句话停住了你的拇指：「如果忘记你那么容易，那我爱你干嘛」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d1227977736","text":"你在旧笔记本的扉页看到自己抄过的一句话：「远赴人间惊鸿宴，一睹大唐盛世颜」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d142db7d6ab","text":"你刷到一条陌生人的留言：「尘染梧桐穿叶落，暖春秋色是人寰」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d434068b4a0","text":"朋友转发来一句话：「君埋泉下泥销骨，我寄人间雪满头」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d5be55c12d5","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「天下没有不散的宴席」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d72c60fd486","text":"你在旧笔记本的扉页看到自己抄过的一句话：「团雀闹，好事近」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d885bdd3695","text":"你刷到一条陌生人的留言：「我们活在三维空间，我们生存在这个世界 ，但我们最终活成的都是我们自己的位面体」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d944c06dd4d","text":"朋友转发来一句话：「我是说，一个人的生命就像一副充满了点数是所谓“X”的牌堆，只要牌堆还没见底，你就能根据运气与先天条件推导排列出最优选择」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_2d9a3eecf9d8","text":"你刷到一条陌生人的留言：「三万年的距离，也不及你我的爱河」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}}, n_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_31ef7c484c9e","text":"你刷到一条陌生人的留言：「终有一天你会跨过静谧无声的洗墨江，离开群山环抱的旧桃源，来到无边阴霾的夜空之下。你要记得，命运悬在刀尖上，而刀尖须得永远向前。愿你在冷铁卷刃前，得以窥见天光」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_3212a55cf26a","text":"朋友转发来一句话：「我想伟大的思想家确实有同样的想法」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_321498e2b5c5","text":"歌单随机到一首老歌，热评第一写着：「若我身处这长夜不会自己过去，那就用光芒与白昼重新定义」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_3219f264c9e4","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「心不动，则不痛；爱不离，则不弃」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_3220a475baee","text":"你在旧笔记本的扉页看到自己抄过的一句话：「装作拥有某样品质，实际上就等于承认了自己并没有这样品质」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32320fcb8a60","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「迈出第一步的是他，迈出第二步的也是他，一步一步的都是他。但害怕的也是他，一惊一乍的同样是他」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_323a070d73a3","text":"你刷到一条陌生人的留言：「before was was was, was was is」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_3254714b93b3","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「人类的悲欢并不相通，我只是觉得他们吵闹」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_325faeb8fb5d","text":"深夜的评论区里，一句话停住了你的拇指：「我想与你共度余生，但不是今天」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_3265d57f895b","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「The things that make us different also make us great」。到站了你还在想。","domain":"finance","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":3,"stress":-2}},{"id":"evt_328ef4ee0275","text":"歌单随机到一首老歌，热评第一写着：「你知不知道，难做的事和应该做的事，往往是同一件事」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32a8da440eb8","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「内心湛然，则无往而不乐」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32ad9c9975db","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「来了，爱了，给了她一颗星星，走了」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32becb8aab88","text":"朋友转发来一句话：「请成为永远疯狂 ，永远浪漫 ，永远清澈的存在」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32e541c77805","text":"你在旧笔记本的扉页看到自己抄过的一句话：「霍金，3月14日逝世，享年76岁；爱因斯坦，3月14日出生，享年76岁；哈雷彗星的回归周期，76年；3月14日，圆周率日；3月14日，马克思逝世。仰望星空的人，最终归于星空」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32e915053243","text":"你在旧笔记本的扉页看到自己抄过的一句话：「一个人爱你的最高形式是/接得住你所有的负面情绪/因为说我爱你很容易 买一两次东西也很容易/接吻很容易/拥抱很容易/但在面对你一次又一次负面情绪的时候/不是不耐烦/也不是表面礼貌/是很难的/就像你皱眉的时候 我会觉得心疼/总觉得这个世界给你的不够」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32efd27e8805","text":"歌单随机到一首老歌，热评第一写着：「有些人，一旦遇见，便一眼万年；有些心动，一旦开始，便覆水难收」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_32f809ad826b","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「我身上早已烙下沉默燃烧后遗留下来的哀愁」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_330720ab99f5","text":"歌单随机到一首老歌，热评第一写着：「谁终将声震人间，必长久独自缄默；谁终将点燃闪电，必永恒如云漂泊」。你单曲循环了一晚上。","domain" ,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_338273e7dcc0","text":"歌单随机到一首老歌，热评第一写着：「就像飞蛾扑火，就像虫子扎进深坑。但飞蛾并不觉得灰暗，至少它享受了短暂的光明。且小虫并不觉得悲伤，至少它享受了片刻的安稳」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_338628bacfdf","text":"你在旧笔记本的扉页看到自己抄过的一句话：「付出，不是索求回报的筹码；甘愿，只是喜欢一个人的前提」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_338e7019e77e","text":"朋友转发来一句话：「没有被规则浇灭的勇敢，还在吧，想清楚了，别顾虑了，我交卷了，万一对了呢」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_33a9fb39f2c1","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「一天有一千次，我惊异于我自己，死于现实又以同样不寻常的方式活了过来」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_33b16bd01453","text":"歌单随机到一首老歌，热评第一写着：「自与你相识起，我便觉得你与众不同」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_33c2b9ccef0c","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「行走于苍穹之上，将星空献给你」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_33ca54c78f47","text":"深夜的评论区里，一句话停住了你的拇指：「我希望你的头发，用新的世界地图，将我覆盖；那样，我所去之处，便会美如，你的头发」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_33cdef9fc32d","text":"你刷到一条陌生人的留言：「最美不过你回眸，眸中带笑，笑似烟浓雾霭」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_33fb1ed0f3a3","text":"深夜的评论区里，一句话停住了你的拇指：「事已至此，幸而夜风对他温柔」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_340b01d5420e","text":"歌单随机到一首老歌，热评第一写着：「幸福是欲望的暂时停止，我们就像田野上的羔羊，在屠夫的注视下恣意欢愉」。你单曲循环了一晚上。","domain":"misc","min ":{"happiness":0,"stress":1}},{"id":"evt_4c5cdd849618","text":"你刷到一条陌生人的留言：「只要我喝的够多，寂寞就侵蚀不了我」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4c5f7e6151b0","text":"朋友转发来一句话：「你们说，谢府的宴为什么就摆不尽呢？尘不到，这儿的月亮为什么总不圆呢」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4c944c5cd681","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「差距并不可怕，可怕的是因为差距而放弃」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cac10f76041","text":"歌单随机到一首老歌，热评第一写着：「我不相信长夜将至，因为火把就在我的手中」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cc00e43bae8","text":"歌单随机到一首老歌，热评第一写着：「自律，说起来简单，落下去复杂；听起来像感觉，做起来是原则」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cc397c78013","text":"深夜的评论区里，一句话停住了你的拇指：「我生来就是高山而非溪流，我欲于群峰之巅俯视平庸的沟壑。我本来就是人杰而非草芥，我站在伟人之间藐视卑微的懦夫」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cc78560d09f","text":"你刷到一条陌生人的留言：「八方各异气，千里殊风雨」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cc941010f94","text":"深夜的评论区里，一句话停住了你的拇指：「现实就是一本蹩脚的小说，它从不按常理出牌」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cd305ebe120","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「当人觉得自己看不到前途时，其实已经看到了前途」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cda4e9650a0","text":"朋友转发来一句话：「“不去努力然后告诉自己我根本就不想要”的痛苦，比“拼命努力后失败”的痛苦，要小得多」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-6,"stress":4}},{"id":"evt_4cdcae17a658","text":"歌单随机到一首老歌，热评第一写着：「痛苦证明你还活着，活着就要战胜痛苦」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":-3,"stress":2}},{"id":"evt_4cde7ea995f1","text":"你在旧笔记本的扉页看到自己抄过的一句话：「一以贯之的努力，不得懈怠的人生」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4ce3d04a899d","text":"你刷到一条陌生人的留言：「我怕音乐，它总是让我想起一些不该想的事。他总是会让旧伤复发」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4cfa40850240","text":"深夜的评论区里，一句话停住了你的拇指：「此身合是诗人未？细雨骑驴入剑门」。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d0f3c262a4a","text":"朋友转发来一句话：「读书使人渊博，交谈使人机敏，写作使人谨慎」。你回了个表情，心里却记下了。","domain":"growth","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d1675c826b4","text":"歌单随机到一首老歌，热评第一写着：「只有除了爱情什么都不缺的人，才有底气去等待爱情」。你单曲循环了一晚上。","domain":"romance","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d27e0a84024","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「求你别离开我，因为我，欠你太多」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d2c5b8343e8","text":"你在旧笔记本的扉页看到自己抄过的一句话：「你我之间就像VIP的试听片段」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d45b24ab5e7","text":"歌单随机到一首老歌，热评第一写着：「不去占有就是最好的拥有」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d5c0c99f111","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「苍天有眼，命数天定，但行好事，莫问前程」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_4d5db4467dad","text":"朋友转发来一句话：「昨夜疾风飞瀚海，怎料夏花犹在」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.5,"kind":"ambient","effects":{"happiness":0,"stress":1}},{"id":"evt_hm_001","text":"深夜加完班走出写字楼，你发现路边摊的烤红薯和二十年前老家门口的一个味道。","domain":"career","min_age":22,"max_age":45,"weight":1.0,"effects":{"happiness":3}},{"id":"evt_hm_002","text":"部门空降了一位新领导，把你负责了两年的项目整个推翻重来。","domain":"career","min_age":24,"max_age":55,"weight":1.0,"effects":{"happiness":-4,"stress":8}},{"id":"evt_hm_003","text":"你带的实习生第一次独立完成任务后，特地跑来向你道谢。你忽然理解了当年前辈看你的眼神。","domain":"career","min_age":26,"max_age":55,"weight":0.8,"trait_bias":{"A":0.4},"effects":{"happiness":5}},{"id":"evt_hm_004","text":"一个猎头突然打来电话，报出的数字让你心跳漏了一拍。你在地铁上想了一路。","domain":"career","min_age":25,"max_age":45,"weight":1.0,"trait_bias":{"O":0.3},"effects":{"stress":3}},{"id":"evt_hm_005","text":"年会抽奖你中了最大的奖，同事起哄让你请客，热闹了一整晚。","domain":"career","min_age":22,"max_age":60,"weight":0.6,"trait_bias":{"E":0.3},"effects":{"happiness":4}},{"id":"evt_hm_010","text":"你在老同学的婚礼上被安排在'单身桌'，一桌人尴尬地互相敬酒。","domain":"romance","min_age":24,"max_age":40,"weight":0.8,"effects":{"happiness":-3}},{"id":"evt_hm_011","text":"前任在朋友圈晒出了婚纱照。你盯着看了十秒，点了个赞，又默默取消了。","domain":"romance","min_age":22,"max_age":45,"weight":0.8,"trait_bias":{"N":0.4},"effects":{"happiness":-4,"stress":4}},{"id":"evt_hm_012","text":"你和伴侣为了'谁忘了倒垃圾'大吵一架，最后却因为吵得太离谱笑作一团。","domain":"romance","min_age":22,"max_age":70,"weight":1.0,"effects":{"happiness":3,"stress":-2}},{"id":"evt_hm_013","text":"长辈又一次在饭桌上问起你的感情状况，你笑着扒饭，把话题岔了过去。","domain":"romance","min_age":24,"max_age":40,"weight":1.0,"effects":{"stress":4}},{"id":"evt_hm_020","text":"父亲的白头发好像一夜之间多了很多。视频通话里他还是那句'家里都好，别担心'。","domain":"family","min_age":25,"max_age":60,"weight":1.2,"effects":{"happiness":-3}},{"id":"evt_hm_021","text":"收拾旧物时翻出小学的日记本，里面写着'长大以后一定要……'。你合上本子坐了很久。","domain":"family","min_age":25,"max_age":70,"weight":0.8,"trait_bias":{"O":0.3},"effects":{"happiness":2}},{"id":"evt_hm_022","text":"母亲学会了发语音红包，逢年过节准时发来八块八，附一句'注意身体'。","domain":"family","min_age":22,"max_age":60,"weight":1.0,"effects":{"happiness":4}},{"id":"evt_hm_023","text":"家族群里因为一条养生谣言吵了起来，你打了一大段科普又逐字删掉了。","domain":"family","min_age":20,"max_age":60,"weight":0.8,"trait_bias":{"A":-0.3},"effects":{"stress":2}},{"id":"evt_hm_024","text":"孩子第一次开口叫你，你愣了两秒，眼眶一下就热了。","domain":"family","min_age":24,"max_age":45,"weight":1.0,"effects":{"happiness":8}},{"id":"evt_hm_030","text":"体检报告上多了两个箭头。你把'规律作息'四个字写进了新年计划——第三次。","domain":"health","min_age":26,"max_age":60,"weight":1.2,"effects":{"stress":4}},{"id":"evt_hm_031","text":"你连续跑步满一百天，体重没怎么变，但爬六楼不喘了。","domain":"health","min_age":18,"max_age":65,"weight":0.8,"trait_bias":{"C":0.5},"effects":{"happiness":4,"health":3,"stress":-3}},{"id":"evt_hm_032","text":"一场重感冒把你击倒在出租屋里，你烧得迷迷糊糊，第一次认真想到了'一个人'这件事。","domain":"health","min_age":20,"max_age":40,"weight":0.8,"effects":{"happiness":-4,"health":-2}},{"id":"evt_hm_033","text":"你尝试冥想来对抗失眠，结果在第三分钟睡着了。也算成功。","domain":"health","min_age":20,"max_age":70,"weight":0.6,"trait_bias":{"N":0.4},"effects":{"stress":-4}},{"id":"evt_hm_040","text":"房东通知涨租的那天，你打开了买房计算器，按了几下又默默关掉。","domain":"finance","min_age":22,"max_age":40,"weight":1.0,"effects":{"happiness":-3,"stress":5}},{"id":"evt_hm_041","text":"你尘封多年的旧手办在二手平台意外卖出了高价，够吃一个月的午饭。","domain":"finance","min_age":18,"max_age":45,"weight":0.6,"effects":{"happiness":3,"wealth":5}},{"id":"evt_hm_042","text":"你跟风买的基金绿了一整年，你决定把 App 卸载，眼不见心不烦。","domain":"finance","min_age":22,"max_age":55,"weight":0.8,"effects":{"happiness":-2,"wealth":-5}},{"id":"evt_hm_043","text":"你第一次认真记账，月底看到'奶茶'分类的总额时沉默了。","domain":"finance","min_age":18,"max_age":40,"weight":0.8,"trait_bias":{"C":0.3},"effects":{"stress":1}},{"id":"evt_hm_050","text":"你报名的线上课程终于学完了最后一节。结业证书是电子的，成就感是真实的。","domain":"growth","min_age":18,"max_age":60,"weight":0.8,"trait_bias":{"C":0.4,"O":0.3},"effects":{"happiness":4}},{"id":"evt_hm_051","text":"你在书店站着读完了一本书的一半，最后还是把它买了下来——为了另一半。","domain":"growth","min_age":15,"max_age":75,"weight":0.8,"trait_bias":{"O":0.5},"effects":{"happiness":3}},{"id":"evt_hm_052","text":"你心血来潮学做一道硬菜，厨房像被打劫过，但味道意外地不错。","domain":"growth","min_age":18,"max_age":70,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_053","text":"深夜你把学了三个月的吉他弹给自己听，跑调跑得很自由。","domain":"growth","min_age":15,"max_age":60,"weight":0.6,"trait_bias":{"O":0.4},"effects":{"happiness":3,"stress":-2}},{"id":"evt_hm_060","text":"多年没联系的好友突然发来消息：'在吗，路过你的城市，见一面？'你们聊到了打烊。","domain":"social","min_age":20,"max_age":70,"weight":1.0,"trait_bias":{"E":0.3},"effects":{"happiness":5}},{"id":"evt_hm_061","text":"你被拉进了第七个工作群。你把手机调成静音，世界清净了三分钟。","domain":"social","min_age":22,"max_age":55,"weight":0.8,"trait_bias":{"E":-0.4},"effects":{"stress":3}},{"id":"evt_hm_062","text":"小区楼下的流浪猫开始蹭你的裤脚。你顺手买了猫粮，从此多了一份'责任'。","domain":"social","min_age":15,"max_age":80,"weight":0.8,"trait_bias":{"A":0.4},"effects":{"happiness":4}},{"id":"evt_hm_063","text":"你鼓起勇气参加了一场陌生人饭局，全程话不多，但回家路上觉得没那么孤单了。","domain":"social","min_age":18,"max_age":50,"weight":0.6,"trait_bias":{"E":-0.3},"effects":{"happiness":3}},{"id":"evt_hm_070","text":"你在阳台种的小番茄结果了，一共三颗。你郑重其事地拍照留念。","domain":"misc","min_age":18,"max_age":90,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_071","text":"台风夜停电，你点着手机手电筒吃泡面，忽然觉得这一刻也挺浪漫。","domain":"misc","min_age":15,"max_age":80,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_072","text":"你错过了末班车，步行四十分钟回家，路上把这几年的事想了一遍。","domain":"misc","min_age":18,"max_age":60,"weight":0.8,"effects":{"stress":-2}},{"id":"evt_hm_073","text":"手机相册自动生成了'五年前的今天'。你看着照片里的自己，一时说不清是怀念还是感慨。","domain":"misc","min_age":22,"max_age":80,"weight":0.8,"effects":{"happiness":1}},{"id":"evt_hm_074","text":"你在旧衣服口袋里摸出一张没刮的彩票。刮开：谢谢惠顾。你笑了一下，扔进了垃圾桶。","domain":"misc","min_age":18,"max_age":80,"weight":0.6},{"id":"evt_hm_080","text":"凌晨三点你还清醒着，给自己列了一张'三十岁之前要做的事'清单，然后安心睡去。","domain":"growth","min_age":20,"max_age":29,"weight":0.8,"trait_bias":{"C":0.3,"N":0.2},"effects":{"stress":-2}},{"id":"evt_hm_081","text":"你参加了人生第一场马拉松，在最后一公里几乎是走过终点的，但奖牌货真价实。","domain":"health","min_age":18,"max_age":55,"weight":0.6,"trait_bias":{"C":0.4,"E":0.2},"effects":{"happiness":6,"health":2}},{"id":"evt_hm_082","text":"退休后的第一个工作日早晨，你习惯性地七点醒来，然后想起不用上班，又幸福地睡了回去。","domain":"career","min_age":60,"max_age":75,"weight":1.0,"effects":{"happiness":5,"stress":-5}},{"id":"evt_hm_083","text":"你开始教社区的老人用智能手机，他们叫你'小老师'，虽然你也不年轻了。","domain":"social","min_age":45,"max_age":80,"weight":0.8,"trait_bias":{"A":0.4},"effects":{"happiness":5}},{"id":"evt_hm_084","text":"孙辈拿着作业来问你问题，你偷偷在另一个房间搜索了答案，保住了长辈的威严。","domain":"family","min_age":55,"max_age":90,"weight":0.8,"effects":{"happiness":5}},{"id":"evt_hm_085","text":"高中晚自习停电的那晚，整栋楼的人在黑暗里欢呼。多年后你还会想起那片星星点点的手机光。","domain":"growth","min_age":15,"max_age":19,"weight":0.8,"effects":{"happiness":4}},{"id":"evt_hm_100","text":"早高峰的地铁把你挤成了一张纸，到公司才发现工牌反着挂了一上午。","domain":"career","min_age":22,"max_age":55,"weight":0.8,"effects":{"stress":2}},{"id":"evt_hm_101","text":"你在例会上鼓起勇气提了个想法，居然被采纳了。散会后你在工位上偷偷握了下拳。","domain":"career","min_age":22,"max_age":50,"weight":0.8,"trait_bias":{"E":-0.2},"effects":{"happiness":5}},{"id":"evt_hm_102","text":"电脑在交付前夜蓝屏了。你对着进度条祈祷的样子，虔诚得像个信徒。","domain":"career","min_age":20,"max_age":55,"weight":0.8,"effects":{"stress":6}},{"id":"evt_hm_103","text":"食堂阿姨今天多给你打了一勺菜，还冲你笑了笑。这一天好像都顺了起来。","domain":"career","min_age":18,"max_age":60,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_104","text":"离职的同事把工位上的绿萝托付给你。你接过来的时候，突然有点舍不得这个人。","domain":"career","min_age":22,"max_age":55,"weight":0.8,"effects":{"happiness":-1}},{"id":"evt_hm_105","text":"你熬了三个通宵赶完的方案，客户一句'先放放'就没了下文。","domain":"career","min_age":22,"max_age":50,"weight":0.8,"effects":{"happiness":-3,"stress":5}},{"id":"evt_hm_110","text":"你定了五个起床闹钟，最终在第五个响起后的二十分钟起床，动作行云流水。","domain":"health","min_age":15,"max_age":45,"weight":0.8,"trait_bias":{"C":-0.4},"effects":{"stress":1}},{"id":"evt_hm_111","text":"体重秤的数字让你决定今晚只吃沙拉。夜里十一点，你站在冰箱前输掉了这场战争。","domain":"health","min_age":16,"max_age":55,"weight":0.8,"effects":{"happiness":1}},{"id":"evt_hm_112","text":"你第一次去做心理咨询，出门前紧张得转了三圈。结束时你在楼下买了杯热的，觉得自己迈出了很大一步。","domain":"health","min_age":18,"max_age":60,"weight":0.6,"trait_bias":{"N":0.5},"effects":{"happiness":4,"stress":-6}},{"id":"evt_hm_113","text":"牙疼拖了两周，你终于坐上了牙科的椅子。医生说：再晚来一周就麻烦了。","domain":"health","min_age":18,"max_age":70,"weight":0.8,"effects":{"health":-1,"stress":3}},{"id":"evt_hm_114","text":"你办了张健身卡。教练的朋友圈里，你的名字出现在'本月最久未到店'名单上。","domain":"health","min_age":18,"max_age":55,"weight":0.8,"trait_bias":{"C":-0.4},"effects":{"happiness":-1}},{"id":"evt_hm_120","text":"外卖比预计早到了二十分钟，你觉得今天是被生活温柔以待的一天。","domain":"finance","min_age":18,"max_age":50,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_121","text":"你清理了一遍订阅扣费，发现有个会员已经默默续了两年，你一次都没用过。","domain":"finance","min_age":20,"max_age":55,"weight":0.8,"effects":{"wealth":2,"stress":1}},{"id":"evt_hm_122","text":"双十一你清空了购物车，第二天又默默退掉了一半。你为自己的理性感到骄傲，大概。","domain":"finance","min_age":18,"max_age":50,"weight":0.8,"effects":{"happiness":1}},{"id":"evt_hm_123","text":"你在旧外套里摸出一张一百块。这笔'意外之财'带来的快乐，远超它的面值。","domain":"finance","min_age":15,"max_age":80,"weight":0.6,"effects":{"happiness":3,"wealth":1}},{"id":"evt_hm_130","text":"你妈打视频过来只是想给你看阳台新开的花。你们聊了四十分钟的'没什么事'。","domain":"family","min_age":20,"max_age":60,"weight":1.0,"effects":{"happiness":4}},{"id":"evt_hm_131","text":"回老家时你发现自己的房间还保持着上学时的样子，书桌上的贴纸都没撕。","domain":"family","min_age":20,"max_age":50,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_132","text":"爸妈开始转发'年轻人要多喝热水'给你，你一边吐槽一边把水烧上了。","domain":"family","min_age":18,"max_age":45,"weight":0.8,"effects":{"happiness":2}},{"id":"evt_hm_133","text":"全家福里你终于站到了后排最高的位置，而爷爷坐在了最中间。","domain":"family","min_age":16,"max_age":40,"weight":0.6,"effects":{"happiness":3}},{"id":"evt_hm_140","text":"群里组局的消息刷了九十九条，你从'在吗'开始看，看到'下次一定'结束。","domain":"social","min_age":18,"max_age":45,"weight":0.8,"trait_bias":{"E":-0.3},"effects":{"happiness":1}},{"id":"evt_hm_141","text":"你帮邻居收了一次快递，从此你们在电梯里从点头之交升级成了'哎最近怎么样'。","domain":"social","min_age":20,"max_age":70,"weight":0.8,"trait_bias":{"A":0.3},"effects":{"happiness":2}},{"id":"evt_hm_142","text":"理发师问'剪短一点可以吧'，你说可以。走出店门时你决定这个月都戴帽子。","domain":"misc","min_age":15,"max_age":60,"weight":0.8,"effects":{"happiness":-2}},{"id":"evt_hm_143","text":"你养的多肉又双叒叕死了。植物界一致认为你的爱太沉重。","domain":"misc","min_age":18,"max_age":60,"weight":0.6,"effects":{"happiness":-1}},{"id":"evt_hm_144","text":"深夜楼下有人弹吉他唱歌，唱得一般，但你听完了整首，还差点鼓掌。","domain":"misc","min_age":15,"max_age":70,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_145","text":"你把手机屏幕时间报告截图发给朋友，配文'我有病'。朋友回了他的截图：比你多两小时。","domain":"misc","min_age":15,"max_age":45,"weight":0.8,"effects":{"happiness":1}},{"id":"evt_hm_146","text":"第一场雪落下来的时候，你正好在窗边。你给三个人发了消息：'下雪了。'","domain":"misc","min_age":15,"max_age":80,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_147","text":"你在早餐摊前排了十分钟队，就为了那一口刚出锅的。摊主记得你不要香菜。","domain":"misc","min_age":16,"max_age":80,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_148","text":"打车遇到一位话痨司机，下车时你居然听完了他半辈子的故事，还有点意犹未尽。","domain":"social","min_age":18,"max_age":70,"weight":0.6,"trait_bias":{"O":0.3},"effects":{"happiness":2}},{"id":"evt_hm_149","text":"你收藏了第一百零一篇'如何早起'的文章，然后关掉手机继续睡了。","domain":"growth","min_age":16,"max_age":45,"weight":0.8,"trait_bias":{"C":-0.3},"effects":{"happiness":1}},{"id":"evt_hm_150","text":"旧手机在抽屉里开机成功，锁屏壁纸和聊天记录像一封没寄出的信。","domain":"misc","min_age":20,"max_age":60,"weight":0.6,"effects":{"happiness":1}},{"id":"evt_hm_151","text":"考试周的图书馆一座难求，你占到了靠窗的位置，阳光晒得书页发亮。","domain":"growth","min_age":15,"max_age":26,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_152","text":"宿舍夜谈会从'明天吃什么'聊到'人活着是为了什么'，最后在此起彼伏的呼噜声中散会。","domain":"growth","min_age":16,"max_age":24,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_153","text":"你在课堂上被点名回答问题，站起来的瞬间大脑一片空白，坐下的瞬间答案全想起来了。","domain":"growth","min_age":12,"max_age":24,"weight":0.8,"effects":{"stress":2}},{"id":"evt_hm_154","text":"毕业多年后你梦见还有一门课没考。惊醒后你花了整整一分钟说服自己已经毕业了。","domain":"misc","min_age":25,"max_age":60,"weight":0.8,"effects":{"stress":1}},{"id":"evt_hm_155","text":"你在公园下棋赢了一位大爷，大爷不服，摆子再来。你们杀到了路灯亮起。","domain":"social","min_age":50,"max_age":90,"weight":0.8,"effects":{"happiness":4}},{"id":"evt_hm_156","text":"晨练的队伍里你的动作总慢半拍，但没人介意，音乐照放，太阳照升。","domain":"health","min_age":55,"max_age":90,"weight":0.8,"effects":{"happiness":3,"health":1}},{"id":"evt_hm_157","text":"你学会了用手机挂号，帮同龄的老朋友也挂了一个。他非要请你吃早茶。","domain":"social","min_age":55,"max_age":90,"weight":0.8,"trait_bias":{"O":0.3},"effects":{"happiness":4}},{"id":"evt_hm_158","text":"阳台的花开了第二茬。你搬了把椅子坐在旁边，什么也不做，就看着。","domain":"misc","min_age":50,"max_age":95,"weight":0.8,"effects":{"happiness":3,"stress":-3}},{"id":"evt_hm_159","text":"你把这些年的照片整理成了相册，翻到最后一页时，窗外刚好日落。","domain":"misc","min_age":55,"max_age":95,"weight":0.6,"effects":{"happiness":4}},{"id":"evt_hm_160","text":"台灯下你陪孩子写作业，一道数学题你们俩都不会，最后一起搜了答案并约定保密。","domain":"family","min_age":28,"max_age":50,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_161","text":"孩子把学校发的小红花贴在了你的手机壳上，说'给你也发一朵'。","domain":"family","min_age":26,"max_age":45,"weight":0.8,"effects":{"happiness":5}},{"id":"evt_hm_162","text":"你在家长群里潜水一年，今天第一次发言，秒收三个'收到'。","domain":"family","min_age":28,"max_age":50,"weight":0.6,"trait_bias":{"E":-0.3},"effects":{"stress":1}},{"id":"evt_hm_163","text":"加完班回家，你在楼下坐了十分钟才上楼——你想把疲惫留在车里，把笑脸带回家。","domain":"family","min_age":26,"max_age":55,"weight":0.8,"trait_bias":{"A":0.3},"effects":{"stress":2,"happiness":1}},{"id":"evt_hm_164","text":"你和多年的老友约了顿火锅，从毕业聊到房贷，从头发聊到体检报告，谁也没提'改天再约'。","domain":"social","min_age":28,"max_age":60,"weight":0.8,"effects":{"happiness":5}},{"id":"evt_hm_165","text":"雨天你没带伞，便利店老板借了你一把，说'下次路过还我就行'。你后来专程去还了伞，还买了瓶水。","domain":"social","min_age":15,"max_age":80,"weight":0.6,"trait_bias":{"A":0.3},"effects":{"happiness":4}},{"id":"evt_hm_200","text":"你在打印店排队时，前面的人回头问你会不会用这台机器。你其实也不会，但你们一起研究明白了。","domain":"social","min_age":16,"max_age":60,"weight":0.7,"effects":{"happiness":2}},{"id":"evt_hm_201","text":"你把用了六年的水杯摔碎了。买了个新的，却总觉得水的味道不太一样。","domain":"misc","min_age":18,"max_age":80,"weight":0.7,"effects":{"happiness":-2}},{"id":"evt_hm_202","text":"你终于把堆了半年的快递纸箱拆完扔掉，房间空出一角，心里也空出一块。","domain":"misc","min_age":18,"max_age":60,"weight":0.7,"trait_bias":{"C":0.3},"effects":{"happiness":2,"stress":-2}},{"id":"evt_hm_203","text":"楼下新开了一家面馆，你成了第一批常客。老板第三次见你就知道你要加蛋。","domain":"misc","min_age":18,"max_age":75,"weight":0.7,"effects":{"happiness":3}},{"id":"evt_hm_204","text":"你在超市抢到了最后一盒打折的车厘子，推着购物车走路带风。","domain":"finance","min_age":18,"max_age":75,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_205","text":"你给自己做了顿丰盛的饭，摆好盘拍了照，然后一个人安安静静吃完了。","domain":"misc","min_age":18,"max_age":70,"weight":0.7,"trait_bias":{"E":-0.3},"effects":{"happiness":3}},{"id":"evt_hm_206","text":"你把攒了很久的话在心里排练了三遍，最后只发出去一句'在忙吗'。","domain":"social","min_age":16,"max_age":50,"weight":0.7,"trait_bias":{"N":0.4},"effects":{"stress":3}},{"id":"evt_hm_207","text":"你终于取关了那些让你焦虑的账号，刷手机的时间少了一半。","domain":"health","min_age":16,"max_age":55,"weight":0.7,"trait_bias":{"N":0.3},"effects":{"stress":-5,"happiness":3}},{"id":"evt_hm_208","text":"同事请了长假去徒步，回来晒黑了一圈。你一边说'真好'，一边默默打开了地图。","domain":"career","min_age":22,"max_age":50,"weight":0.7,"trait_bias":{"O":0.4},"effects":{"happiness":1}},{"id":"evt_hm_209","text":"你被拉去凑数打了场球，输得很惨，但出汗的感觉久违地好。","domain":"health","min_age":15,"max_age":50,"weight":0.7,"trait_bias":{"E":0.3},"effects":{"happiness":3,"health":1}},{"id":"evt_hm_210","text":"你在旧书店淘到一本绝版书，扉页上有前主人写的一行字。","domain":"growth","min_age":16,"max_age":75,"weight":0.6,"trait_bias":{"O":0.5},"effects":{"happiness":4}},{"id":"evt_hm_211","text":"你连着三天早起，第四天闹钟响的时候，你居然是自己先醒的。","domain":"health","min_age":15,"max_age":60,"weight":0.7,"trait_bias":{"C":0.4},"effects":{"happiness":3,"health":1}},{"id":"evt_hm_212","text":"你精心准备的生日惊喜提前被剧透了。对方还是很配合地演完了整场惊喜。","domain":"romance","min_age":18,"max_age":60,"weight":0.6,"effects":{"happiness":4}},{"id":"evt_hm_213","text":"你在通讯录里翻到一个再也不会拨出去的号码，犹豫很久，没有删。","domain":"romance","min_age":20,"max_age":60,"weight":0.7,"trait_bias":{"N":0.3},"effects":{"happiness":-3}},{"id":"evt_hm_214","text":"你和伴侣周末哪也没去，各自窝在沙发两头看书，一下午没说几句话，很舒服。","dom
