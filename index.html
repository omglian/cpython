function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}
function sfc32(a, b, c, d) {
  return function () {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;

    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

function splitSentences(text) {
  return text.split(/[。！？!?\n;；]+/).map(s => s.trim()).filter(Boolean);
}
function countOccurrences(haystack, needle) {
  if (!needle) return 0;
  let count = 0, pos = 0;
  while ((pos = haystack.indexOf(needle, pos)) !== -1) { count++; pos += needle.length; }
  return count;
}
function scan(text, sentences, table) {
  const lowered = text.toLowerCase();
  let score = 0;
  const evidence = [];
  for (const [keyword, weight] of Object.entries(table)) {
    const count = countOccurrences(lowered, keyword.toLowerCase());
    if (count <= 0) continue;
    score += weight * Math.sqrt(count);
    let source = "";
    for (const sent of sentences) {
      if (sent.toLowerCase().includes(keyword.toLowerCase())) { source = sent.slice(0, 60); break; }
    }
    evidence.push({keyword, weight: Math.round(weight * 100) / 100, count, sentence: source});
  }
  evidence.sort((a, b) => Math.abs(b.weight) * b.count - Math.abs(a.weight) * a.count);
  return [score, evidence];
}

  const squashed = Math.tanh(raw / 8);
  const reliability = Math.pow(Math.min(1, textLen / 200), 0.5);
  return Math.round(50 + squashed * 45 * reliability);
}

  if (!gender) for (const [pat, g] of GENDER_HINTS) { if (pat.test(text)) { gender = g; break; } }

  let eduLevel = 1;
  for (const [keyword, rank] of EDU_RANK) { if (text.includes(keyword)) { eduLevel = rank; break; } }

  const numbers = (text.match(/\d+/g) || []).length;
  const years = (text.match(/(?:19|20)\d{2}/g) || []).length;
  const markers = ["那年","那天","后来","因为","所以","记得","当时","第一次"].reduce((s, w) => s + countOccurrences(text, w), 0);
  const detail = Math.round(Math.min(textLen / 800, 1) * 50 + Math.min(numbers / 10, 1) * 20 + Math.min(years / 4, 1) * 15 + Math.min(markers / 8, 1) * 15);
  const evidenceCount = Object.values(bigFiveEvidence).reduce((s, v) => s + v.length, 0);
  const confidence = Math.round(detail * 0.6 + Math.min(evidenceCount / 25, 1) * 40);

  return {
    big_five: bigFive, big_five_names: BIG_FIVE_NAMES, big_five_evidence: bigFiveEvidence,
    values, value_names: VALUE_NAMES,
    attachment: bestStyle, attachment_name: ATTACHMENT_NAMES[bestStyle],
    facts, fact_names: FACT_NAMES,
    age, age_source: ageSource, gender,
    education_level: eduLevel,
    married: ["结婚","老婆","妻子","老公","丈夫"].some(k => text.includes(k)) && !text.includes("离婚"),
    has_children: ["女儿","儿子","孩子上","我的孩子"].some(k => text.includes(k)),
    entrepreneur: text.includes("创业"),
    detail_score: detail, confidence, text_length: textLen,
  };
}

倒。指不定哪天你就改变世界了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_094eb4419284","text":"歌单随机到一首老歌，热评第一写着：「鲁迅：我没说过这句话」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_096f71cf6062","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「梦想家是把他的想象变成现实的人。他从不感到疲倦，并且继续鼓舞人心，坚持自己的梦想，并把它变成现实」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0979badf3565","text":"深夜的评论区里，一句话停住了你的拇指：「十里佳酿千里醉，九尺暖阳半寸寒」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_098e167cfa7b","text":"深夜的评论区里，一句话停住了你的拇指：「你终会明白，前途比爱情重要，你还会明白爱情比前途更难得，但你最后会明白，对的人应该站在你的前途里」。","domain":"romance","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0997b6cf292e","text":"你在旧笔记本的扉页看到自己抄过的一句话：「一年中和一生中的秋天，时光很短暂，但是更加晴朗而缺少变化」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_099f1b3caf99","text":"你刷到一条陌生人的留言：「思念悬枝，月影迟迟」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09babfea2a77","text":"你刷到一条陌生人的留言：「君子不重，则不威，学则不固」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09bf9c4910e1","text":"朋友转发来一句话：「充其量只是好奇罢了」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09c482cc61c6","text":"你在旧笔记本的扉页看到自己抄过的一句话：「一曲风寒心摇曳，几处花繁争雨蝶。爱至深处不问解，亦是情绵亦是别」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09cb6a02cf62","text":"歌单随机到一首老歌，热评第一写着：「不要刻意去猜测他人的想法，如果你没有智慧与经验的正确判断，通常都会有错误的」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09d9847c9861","text":"深夜的评论区里，一句话停住了你的拇指：「神伤。伤及四海，四海难平，望滔滔大浪」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09e62d8343f1","text":"你刷到一条陌生人的留言：「谨记自己总会死去，是让自己避免陷入“人生有所失”思考的最佳方法」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_09fce3070acb","text":"你刷到一条陌生人的留言：「愿颠倒的天空吞噬一切绝望与不幸」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_0a01065f80bc","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「今天是一起养狗，以后就一起遛狗，日久生情，狗又生狗」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a1c96469424","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「门不当，户不对，没点儿本事别遭罪，你是好人，我不配，忘了我吧，下一位，skr」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a276cb1a453","text":"你刷到一条陌生人的留言：「有一天我也会累死，会突然闭上眼睛，在生命的最后一秒，会思考人生的忙碌，想起那些立下的目标，说出那些誓言，最后倒在人群面前」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_0a36e79da565","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「发现好笑的东西，想分享，却发现已经很久没说过一句话了，那个人已经永远离开了」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a36febd7258","text":"你刷到一条陌生人的留言：「真正没有资格谈明天的人，是那个不懂得珍惜今天的人」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a43a1851e35","text":"你刷到一条陌生人的留言：「从前的光太耀眼，不再照耀了自然舍不得。舍不得也没用，做选择的从来不是我，作为一个选项，拥有舍不得这种情感，实在是太过残忍」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a451843907c","text":"你们的爱太深刻，太炽热，以至于世间的一切表达都显得太平淡，太苍白。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a69d8327884","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「因为无能为力，所以顺其自然。因为心无所恃，所以随遇而安」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a6d06fa4b37","text":"歌单随机到一首老歌，热评第一写着：「上帝说要有光，于是萝莉就掀起了裙子」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0a91a941431f","text":"你刷到一条陌生人的留言：「鞭炮再响，可哪有我想你那么想」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0aac2cc34f35","text":"歌单随机到一首老歌，热评第一写着：「野蛮人之间人吃人，文明人之间人骗人」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0afb326c6090","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「这座城市由无数无名的人缔造，他们使这座城市承载了无数文明的痕迹。不过现在这里只会留下我的名字，因为我身后的烈火已将其焚烧殆尽」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0b0f1084b1c1","text":"你刷到一条陌生人的留言：「蝶舞休时，大梦初醒，万籁俱静」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0b0fc7bd8208","text":"歌单随机到一首老歌，热评第一写着：「窗寒嗟悔昔时勇，想当年、剑指白霜」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0b432a0d8308","text":"你在旧笔记本的扉页看到自己抄过的一句话：「停下脚步才注意到 世界被染得雪白」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0b4d778ca4e4","text":"朋友转发来一句话：「芝兰生于深林，不以无人而不芳；君子修道立德，不为穷困而改节」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0b671a882f52","text":"你刷到一条陌生人的留言：「君子当自强方成事」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0b709570fae1","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「当痛苦绵延不绝，当欲望与日俱增，命运其实正在告诉你：嗨，改变的时候到了」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_0b8851844d26","text":"深夜的评论区里，一句话停住了你的拇指：「青春贵吗？贵在——后来所有的黄金，都买不起那一日的黄昏」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0baeb3e31aec","text":"你刷到一条陌生人的留言：「天空本是一种风景，可是遇见你之后，它变成了一种心情」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0bb012b76d26","text":"你在旧笔记本的扉页看到自己抄过的一句话：「难舍，难分，难解，缘起，缘浅，缘灭」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0bb57e4af842","text":"朋友转发来一句话：「个人的一生都可以用来逐梦、体验各种未知，而不是一天重复了几十年」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0bb98dae78d8","text":"你在旧笔记本的扉页看到自己抄过的一句话：「百无聊赖的白日与长夜，总有一天会化为回忆远置吧」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0bb9d5373d59","text":"你刷到一条陌生人的留言：「灰烬与雪交织，刀锋轻颤如悲鸣」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0bfa3140e449","text":"你刷到一条陌生人的留言：「逃避者不配拥有未来」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0c6b23e96d53","text":"你在旧笔记本的扉页看到自己抄过的一句话：「让时钟就此冰冻，让我们在无尽的时光里紧紧相拥」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0c7b0412c703","text":"歌单随机到一首老歌，热评第一写着：「你就當，從沒認識我吧，反正，你也這樣做了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0c80654a0126","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「巧合是上帝默默操控世界的方式」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0c8e60d55d8f","text":"深夜的评论区里，一句话停住了你的拇指：「自信起来，你能做到任何事」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0c924c599b92","text":"你在旧笔记本的扉页看到自己抄过的一句话：「趁着年轻，好好犯病」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0cb070635f6f","text":"你知道治愈只能来自时间，但你也知道，时间没有尽头，你也没有出口。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":3,"stress":-2}},{"id":"evt_0cb233a14541","text":"你刷到一条陌生人的留言：「彼岸花开开彼岸,忘川河畔亦忘川。奈何桥头空奈何,三生石上写三生」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0cbfc1556990","text":"你刷到一条陌生人的留言：「幸福就是当我望向你时，发现你满眼尽是我」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_0cc376cf27f3","text":"深夜的评论区里，一句话停住了你的拇指：「美术之为物，欲者不观，观者不欲」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ce7ad729a14","text":"深夜的评论区里，一句话停住了你的拇指：「也罢就这样吧，淡看缘起缘落，有缘聚，无缘不见」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d15e3d73b5b","text":"你刷到一条陌生人的留言：「风追落叶叶追尘，彩云追月月自明」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d1fc7f77682","text":"你刷到一条陌生人的留言：「只要你不混乱，时间永远够用」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d23d8b071cb","text":"你没有说谎，是爱情说谎，他带你来骗你说，渴望的，有可能，有希望。","domain":"romance","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d3274d2042f","text":"朋友转发来一句话：「你是绚烂白昼，也是沉寂黑夜，你是我血液里涌动的色彩，你是那治愈良药，也是那极致痛苦，你是我渴望触摸的唯一」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d4668be4782","text":"你在旧笔记本的扉页看到自己抄过的一句话：「虚幻的想象如图毒药，尝试抓住在黑暗天气下的一丝光明，却看不见方向」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d4761d903d1","text":"深夜的评论区里，一句话停住了你的拇指：「百般乐器，唢呐为王；不是升天，就是拜堂」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d48e5420538","text":"深夜的评论区里，一句话停住了你的拇指：「时光荏苒，也寻昨日回忆不断，哪怕留万般无奈，傲骨谁还在」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d514a6b6a54","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「幸福的轮廓，大概是圆形吧；那痛苦呢」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d55f57b7ddc","text":"深夜的评论区里，一句话停住了你的拇指：「那么多的梦你一点也不记得，它们又是谁梦见的」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d701d50e517","text":"你在旧笔记本的扉页看到自己抄过的一句话：「时光似酒酿温柔，心事诉与明月收」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d7be82bc3db","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「心事诉与明月收，若问情根深几许，朝朝暮暮共白头」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d7c1c6a0340","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「看看那些开着豪车却随地吐痰的富翁，你就知道没有教育，中国再富裕也不会强大」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d8170d45e7b","text":"朋友转发来一句话：「来自地狱的萤石，怎能叩开天堂的大门」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d888859c8c8","text":"你刷到一条陌生人的留言：「眼泪是一种淡淡的盐水，会在闲的时候悄悄流下。哪怕是一滴微不足道的，一滴微乎其微的，泪都是人闲物寂时，生活最昂贵的调味品」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d8dd15b00a2","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「就算是阴雨天，晾在阳台上的衣服，也会有干的时候」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d943f803551","text":"深夜的评论区里，一句话停住了你的拇指：「遥远的距离使我相思成灰，阴阳的间隔使我欲哭无泪」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_0d977e10bd11","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「找一片树荫，坐在长椅上听远处吹来的风」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0d97b80f7f63","text":"你刷到一条陌生人的留言：「你的拒绝，我珍藏着，它在每个黑夜放出的光是你的同意所不能及的」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0db001456fbf","text":"你刷到一条陌生人的留言：「流萤漫天花共舞，闲蝉栖柳风奏湖。十年一梦不觉醒，夏祭花火终成空」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0dd6dbece3b1","text":"深夜的评论区里，一句话停住了你的拇指：「懂得爱，拥有爱，追寻爱，感受爱，与爱相伴，被爱治愈」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_0de68ed7ebb0","text":"你在旧笔记本的扉页看到自己抄过的一句话：「意义这二字是没有标准的，人生本没有意义，所有的意义是个人自己赋予的，你觉得有意义便有意义」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0df58d352fd7","text":"朋友转发来一句话：「平安喜乐，万事胜意」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0e10381184f4","text":"你在旧笔记本的扉页看到自己抄过的一句话：「在现实生活中我改变我的生命，在这里我们可以用心创造美好」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_0e16d615c8d0","text":"朋友转发来一句话：「每个人都曾有一个梦。但最后我们都把它弄丢了，在追逐幻影的路上」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0e443addb135","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「因为那里面的理想世界，可能我们看的时候已经把自己代入进去了，故事结尾的时候我们又不得已回来现实，自然会空虚」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0e46e3558cd7","text":"你刷到一条陌生人的留言：「如果每个人都能理解你，那么你得普通成什么样子」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0e6c4db8b0d3","text":"朋友转发来一句话：「如果有什么想说却没来得及说的话，就背对世界，在凉夜的雨中，任其轰鸣吧」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0e79f0fb9385","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「都说人无远虑必有近忧，这句话简单来讲就是人这一辈子就没什么安生的日子」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0e82c2f2cb7e","text":"歌单随机到一首老歌，热评第一写着：「谈恋爱我就不派电脑人去，这么好的事派它去干吗啊」。你单曲循环了一晚上。","domain":"romance","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ea2e3ade169","text":"你刷到一条陌生人的留言：「不是我想要放弃，你自己不去珍惜为什么要去怪我」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0eaab01ee981","text":"你也要AK IOI！","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0eb4a0d62d73","text":"你在某一时刻突然发现，你是你一生中最后一个死的人。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0eb713271570","text":"朋友转发来一句话：「记忆模糊之前，或者去见一面」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ebd8e856731","text":"你们因为自己喜欢的人而拒绝了喜欢自己的人，而自己喜欢的人也因为他所喜欢的人拒绝了你。","domain":"romance","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ebe4fead0fa","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「走过了人间风花雪月，看惯了世间爱恨情仇，却依旧捱不过短暂的寂寞」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ec84cd1a598","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「本来阴郁的一天，似乎看到一缕阳光破云而出」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ed8a57e8ec8","text":"歌单随机到一首老歌，热评第一写着：「你所浪费的今天，是昨天死去的人奢望的明天。你所厌恶的现在，是未来的你回不去的曾经」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ed92092a6c7","text":"深夜的评论区里，一句话停住了你的拇指：「半墨荒唐留纸上，半梦清泪掩眸光」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ee31ea47693","text":"你在旧笔记本的扉页看到自己抄过的一句话：「由于我这个阅读速度过快，当我意识到我读到什么内容的时候，一切都已经来不及了」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ee7d865f279","text":"你刷到一条陌生人的留言：「实变函数学十遍，泛函学完心泛寒」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ee829eb431a","text":"你们在努力扩大自己，以靠近，以触及你们自身以外的世界。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f0e96d73405","text":"朋友转发来一句话：「求你别离开我，我拼了命的隐藏着痛」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f325ff4991b","text":"你们追逐浪漫，看到了自己。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f45ac24c54c","text":"你在旧笔记本的扉页看到自己抄过的一句话：「缘起，我在人群中看你；缘灭，我看你在人群中」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f49044f134d","text":"歌单随机到一首老歌，热评第一写着：「当认识到结果没有意义，我们就把目光转向过程。但是，我们试图通过过程寻找的意义，只不过是离散的结果，最终只能归于虚无」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f59960d815a","text":"歌单随机到一首老歌，热评第一写着：「人们要是没有回忆就活不下去，但是只有回忆的话也活不下去。梦总是有会醒来的时候，不会醒的梦总有一天会变成悲伤」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f644c3d26a3","text":"你从不害怕失去什么，人生就是失去与努力取得的一段经历。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f8d3c951737","text":"朋友转发来一句话：「不即浮离恨长失，飘絮久觉是雨珠。若可抛笔放青山，怎道终落又尽途」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f9124a02fb6","text":"朋友转发来一句话：「实力够强了，就不用别人来定义，我做的事我觉得是正确的就行，我不附和他们，他们也会来附和我」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f91f842d91f","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「可口可乐和百事可乐相比之下，冰镇可乐喝得更痛快」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0f989aef8fb2","text":"你在旧笔记本的扉页看到自己抄过的一句话：「雪落的时候，谁还会注意满是阴霾的天空呢」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fa297a57a70","text":"深夜的评论区里，一句话停住了你的拇指：「可以嘲笑你的朋友，但不能嘲笑他喜欢的东西」。","domain":"social","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fa589060dfe","text":"你刷到一条陌生人的留言：「把自己当傻瓜，不懂就问，你会学的更多」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fb1423395ca","text":"歌单随机到一首老歌，热评第一写着：「人为什么要努力？因为怕有朝一日，普通的我，遇见特别的你」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fb30a45afcf","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「力所能及的帮助他人是我们做人的本分，刻意的那么做就超出了我们的能力范畴，说不定还会引来恶意的猜想」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fb380f0544f","text":"你刷到一条陌生人的留言：「你所做的一切，都是在重复昨天」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fc0b6394c59","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「流光驰骤追梦魂，江声叠作青春」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fc15d12ab48","text":"朋友转发来一句话：「不要把你所遭遇的苦难看得太大，更不要把你所拥有的幸福看得太少」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_0fd81e5729af","text":"你喝了李白的酒，却写不出唐诗三百首……","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_0fdd207b575c","text":"你刷到一条陌生人的留言：「风告诉我你在想我，我把思念揉在小溪里，等它化成雨落在你的额头」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ffb11d47a8f","text":"歌单随机到一首老歌，热评第一写着：「混沌初开时，万物有无量。处无力之势，应阴阳二义。立周天风骨，普天下恒世。道尽承负体，一溢亿亿易」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_0ffda8f6cc38","text":"你在旧笔记本的扉页看到自己抄过的一句话：「萧萧玉笛兮孩儿啼，绵绵征军兮终不返」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_10360f8f6a43","text":"你刷到一条陌生人的留言：「H什么的最讨厌了」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_104058722f35","text":"深夜的评论区里，一句话停住了你的拇指：「妙语连珠是猎物，支支吾吾才是喜欢」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_105925a72a0f","text":"歌单随机到一首老歌，热评第一写着：「幸福往往是摸得透彻，而敬业的心却常常隐藏」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_108a4a16b01a","text":"歌单随机到一首老歌，热评第一写着：「祝愿每日会有太阳为你升起，把你当做诗的最后一行」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_10931b66919a","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「你无法同时拥有青春和对青春的感受」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_10b1386941c3","text":"你在旧笔记本的扉页看到自己抄过的一句话：「墓碑下是我们的小宝贝，他既不哭也不闹，只活了二十一天 ，花掉我们四十块钱。他来到这世上，四处看了看，不太满意，就回去了」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_10b33730ddb9","text":"你只是卖伞的人，不想做慈悲的神。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_10bebde3ae27","text":"歌单随机到一首老歌，热评第一写着：「怎样用\"好寂寞\"，来表现我深深的伤口呢」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_10c9b6833206","text":"你刷到一条陌生人的留言：「别等待，趁现在，迈向未来」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_10d6688f2964","text":"你刷到一条陌生人的留言：「为了理想的实现，航行的孤独在所难免」，恍惚间想到了自己的生活。","domain":"social","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_10e5b8428508","text":"歌单随机到一首老歌，热评第一写着：「人不能知道自己不知道什么，当他知道自己不知道的时候，他就已经知道了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_10f66f5a2d8f","text":"你刷到一条陌生人的留言：「为什么我明明什么坏事都没有做，却要被那样看待」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_112cbf192b37","text":"你在旧笔记本的扉页看到自己抄过的一句话：「他乡纵有当头月，不及故乡一盏灯」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_114ab0cf76ad","text":"歌单随机到一首老歌，热评第一写着：「不要胆怯，如果有死者与你擦肩而过，同们，平静地对视吧，无数人的忧伤，使你与众不同」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1160bbd2b9d6","text":"深夜的评论区里，一句话停住了你的拇指：「人生没有白走的路，每走一步都算数」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_116bf4f23923","text":"朋友转发来一句话：「故事的结尾，我在那里藏了一个秘密，我依旧爱着这个世界，这件事，希望你们永远都不要提起」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1192fb448869","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「暴秦朘削民众，陈吴揭竿张楚。天家震以威怒，苍生馈之无穷」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11a1c8b6bc6d","text":"歌单随机到一首老歌，热评第一写着：「持道而修，不可议其」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11ad51e27867","text":"你在旧笔记本的扉页看到自己抄过的一句话：「花草落地生根，它有选择么」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11c95d9eeedb","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「世界是你们的，也是我们的，但是归根结底是你们的。你们青年人朝气蓬勃，正在兴旺时期，好像早晨八九点钟的太阳。希望寄托在你们身上」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11d9a6259c27","text":"歌单随机到一首老歌，热评第一写着：「无人与我立黄昏，无人问我粥可温。 无人与我捻熄灯，无人共我书半生。 无人陪我夜已深，无人与我把酒分。 无人拭我相思痕，无人梦我与前尘。 无人陪我顾星辰，无人醒我茶已冷。 无人听我述衷诚，无人解我心头梦。 无人伴我聆此声，无人愁我独行程。 回首向来萧瑟处，无人等在灯火阑珊处」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11dc2a561fa7","text":"朋友转发来一句话：「你看这个碗他又大又圆」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11ff756e46f4","text":"你刷到一条陌生人的留言：「一觉醒来以为我长高了，起来一看原来是我被子盖横了」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_11ff997f58a6","text":"深夜的评论区里，一句话停住了你的拇指：「非痴非嗔，却应谶」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_121ef95a6d0e","text":"朋友转发来一句话：「听闻那有个神仙，能撒豆成兵，一开始我还不信嘞，直到那个神仙把豆子撒在我的碗里，然后，我成了他的兵」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_12398f44a117","text":"歌单随机到一首老歌，热评第一写着：「蹀躞闲鹤游野路，观朝露，拂晓雾。江流无声，风乱庭前树。淫雨绵绵拨花簇，不胜数，落花处。纵横涕泪迟暮书，载清酤，酌锱铢。云散半晌，月染离人目。清梦悠悠伤睹物，舴艋舟，谁人渡」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1250492bb51e","text":"深夜的评论区里，一句话停住了你的拇指：「并非只有能毁掉你的才值得敬畏」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_126856398a6e","text":"你在旧笔记本的扉页看到自己抄过的一句话：「直到遇到你的那天我才信缘妙不可言，直到分别那天我才知道这个世界上真的存在有缘无分」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_12b4bf65c2b2","text":"朋友转发来一句话：「跟喜欢的人是做不了朋友的，距离远近都是折磨」。你回了个表情，心里却记下了。","domain":"romance","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_12b5c6149b4d","text":"你在旧笔记本的扉页看到自己抄过的一句话：「很多事只是最初看起来有意义，但经过多次重复就慢慢失去了意义」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_12ce04c2aa3e","text":"歌单随机到一首老歌，热评第一写着：「这次我终于解脱，等到了这一刻」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_12f77ca30b71","text":"你是个特别害怕失败的人，为此错过了好多事。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":-3,"stress":2}},{"id":"evt_12feb1f35b38","text":"你知道，时间也许会把你们分开。因此，你把你装进了你的心中。这样，你就无惧时间的洗礼了。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_133a90a840b3","text":"深夜的评论区里，一句话停住了你的拇指：「爱可以穿透时间与空间！堪比万有引力」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_13438699e9bc","text":"歌单随机到一首老歌，热评第一写着：「来去无常，得过且过」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_134659c35441","text":"你在旧笔记本的扉页看到自己抄过的一句话：「只要我足够穷，就没有什么能够诱惑我」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_13658a5696c0","text":"你刷到一条陌生人的留言：「无数少年蜷缩在火车里，却幻想拥抱全世界」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_13a00440a727","text":"深夜的评论区里，一句话停住了你的拇指：「日高悬风拂面留下丝丝温暖，别辜负眼前季节」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_13de6872c7ee","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「日为朝，月为暮，而你是朝朝暮暮」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_13e26d59ad20","text":"深夜的评论区里，一句话停住了你的拇指：「若是你所期望的，那定会得到强烈的回应」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_13e9b66c2698","text":"你刷到一条陌生人的留言：「活着努力干，死了无遗憾」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_140c97c26394","text":"朋友转发来一句话：「历史，是以血为墨书写的巨著」。你回了个表情，心里却记下了。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1419fb49eedf","text":"歌单随机到一首老歌，热评第一写着：「乐观主义和悲观主义对世界都有贡献，前者发明了飞机，后者发明了降落伞」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1421ca92fb7d","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「不求闻达，但求心安」。到站了你还在想。","domain sc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_150c246f911e","text":"朋友转发来一句话：「短暂柔情似流星划落，我是你诗的哪个段落」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1539c4774bc9","text":"歌单随机到一首老歌，热评第一写着：「好好学习，天天向上」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_155225cd94ec","text":"朋友转发来一句话：「忘记一个人，并非不再想起，而是偶尔想起，心中却不再有波澜」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_156714f146b1","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「生活不停殴打我，我一怒之下变成非常好吃的年糕」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1572f7d11ba3","text":"你刷到一条陌生人的留言：「相爱不需要技巧，但是相处需要」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_15762bdace4f","text":"你可以孑然一身，但不能心无所属。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_157a2daa5dd4","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「异地恋是，尝过欣喜若狂，也知道失魂落魄」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_157c24b9c0a7","text":"朋友转发来一句话：「幸福，就是找一个温暖的人过一辈子，然后一辈子都是温暖的」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":6,"stress":-4}},{"id":"evt_1582f7d30b08","text":"你会不断地前进，即使你现在很不好。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_15aa895d1b15","text":"你刷到一条陌生人的留言：「有时候，你不得不停下来，回头看看你走过的路」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_15c1b85b8953","text":"你在旧笔记本的扉页看到自己抄过的一句话：「白夜行、深庭破院，星落寒窗」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_15c6b443cbc0","text":"你 ","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1673e65f181e","text":"你在旧笔记本的扉页看到自己抄过的一句话：「宁愿沉浸在他人所写的主角魅力人生幻想中，也不用抬头去书写属于自己人生」，已经想不起是什么时候抄的了。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_16c9df8ae7ae","text":"歌单随机到一首老歌，热评第一写着：「电脑的处理器总比执行单元小」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_16f1fbd7f9c5","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「不忘初心，方得始终」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_16f858664305","text":"朋友转发来一句话：「如果你热爱生活就不要浪费时间，因为时间组成了生活」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1706354cb52b","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「都已立秋，又何必执着于夏天的故事」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_173ff10a8622","text":"你刷到一条陌生人的留言：「但滥情成了主流，深情便成了罪过」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_177364c77369","text":"朋友转发来一句话：「寒梦凄影深似雪，透彻心思写浓烈」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_17741ff3d00c","text":"你在旧笔记本的扉页看到自己抄过的一句话：「看破了自己才算看破红尘」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_177ac724b9fd","text":"歌单随机到一首老歌，热评第一写着：「她去世时，自己并没有想象中那么悲伤，只是感到很失落。现在才知道，原来是那份悲伤被分散到我的整个余生了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_179a08527fcb","text":"深夜的评论区里，一句话停住了你的拇指：「你搅散一池星光成为我的月亮」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_17aa111adb87","text":"你刷到一条陌生人的留言：「你站在高处，就少往下看」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_17d248625267","text":"你只是五行缺驱动程序，别说你怠惰。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_17d58e7b64e7","text":"歌单随机到一首老歌，热评第一写着：「听了一些日音，想学日语，想去日本，想参加一次烟火大会，哪怕始终是自己一个人努力，也想完成这一切」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_17e92632b36c","text":"深夜的评论区里，一句话停住了你的拇指：「牵着你手的时候，世界属于我」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_17fb073315a7","text":"朋友转发来一句话：「impossible的完整形式是i'm possible」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_17ff9e8f84d5","text":"深夜的评论区里，一句话停住了你的拇指：「科学的浪漫与伟大，人类的传承与感情；人类对科学的向往，一直都在创造着无限可能」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_181b29d94086","text":"朋友转发来一句话：「受伤的次数多了，就知道自己保护自己了」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_182dbb7c8fbe","text":"你喜欢你，仅你可见！","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_184b87020f98","text":"深夜的评论区里，一句话停住了你的拇指：「你真的，不打算用自己喜欢的方式去过这一生吗」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_18831622b01b","text":"歌单随机到一首老歌，热评第一写着：「流水长月，依恋不舍。拾栀雨落，忆梦汐潮。思向呼唤，尔已忘期。汝之憨态，流连忘返」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_189d6092da8e","text":"朋友转发来一句话：「绝望的人没有故乡」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_18b7bea0c52c","text":"歌单随机到一首老歌，热评第一写着：「暗恋不会窥见天光，青梅抵不过天降，永远没有旧情复燃破镜重圆」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_18bb23bc47a5","text":"你是神里绫华的狗！","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_18c40080a657","text":"朋友转发来一句话：「如果你在看，我就是你的风景。如果你在听，我该有多幸运」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_18ccab4bcc15","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「不努力，怎么对的起你的喜欢呢」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_18f072aca5db","text":"深夜的评论区里，一句话停住了你的拇指：「不是他，变成他」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_18f6607b4e4f","text":"你们总喜欢拿顺其自然来敷衍人生路上的荆棘坎坷，却很少承认，真正的顺其自然是竭尽所能之后的不强求，而非两手一摊的不作为。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_191578da7275","text":"歌单随机到一首老歌，热评第一写着：「一本书上每多一个公式，就会减少一半读者」。你单曲循环了一晚上。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19161a796763","text":"深夜的评论区里，一句话停住了你的拇指：「你得到什么东西，必然就会失去什么东西。如果你觉得你什么都没有失去，那可能仅仅是你觉得」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_191787c0e2ad","text":"深夜的评论区里，一句话停住了你的拇指：「兰花，是随风而动，却弯曲下垂，虽是晶莹剔透，但也是撑霆裂月，终有一天会污浊色腥，很像那个折了翼的天使」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_192213a93ed0","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「别让生活蹂躏了你眉间的温柔」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19302a975d45","text":"你们执着于模糊的现在，迷茫于陌生的未来，却从未曾发觉，耳边那一阵灿烂的微风。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_193cc42ddd5e","text":"你刷到一条陌生人的留言：「一见如故，生万千欢喜心」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_197fea628aa5","text":"你在旧笔记本的扉页看到自己抄过的一句话：「混乱本来是我们最害怕的，但我逐渐相信，这也可能是我们最想要的」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19858ba50381","text":"你来见你的时候，没想过你会不开心。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":3,"stress":-2}},{"id":"evt_1995c8f7b2cd","text":"歌单随机到一首老歌，热评第一写着：「请不要带着不好的事情去做自己喜欢做的事情」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19964e15d32d","text":"你以为你和别人不一样,其实你只是另外一种形式的奴隶。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_19967407b28f","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「下凡历劫一场，所以万般皆苦」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19c74e03870e","text":"你在旧笔记本的扉页看到自己抄过的一句话：「看烟花在绽放啊，站在同一片天空下，在最美的年华」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19d5b984b932","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「東京又下雪了，我們似乎再也沒有相見」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19d76ed844fd","text":"歌单随机到一首老歌，热评第一写着：「红绿灯故障了，红灯和绿灯同时亮起，像极了我们之间的故事，明明该停下，却又不舍前行」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19e59d8da390","text":"朋友转发来一句话：「这雨生于天，死于地，中间的过程就是人生」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_19f2c75abb0c","text":"朋友转发来一句话：「赢得了时间就是赢得了一切」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1a01e9f0751f","text":"朋友转发来一句话：「人生用特写镜头来看是悲剧，长镜头来看则是喜剧」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1a0e275e8ed8","text":"你最讨厌的，是对你束手无策。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1a161d0a1edb","text":"深夜的评论区里，一句话停住了你的拇指：「听闻远方有你，动身跋涉千里；我吹过你吹过的风，这算不算相拥」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1a16977ebd58","text":"深夜的评论区里，一句话停住了你的拇指：「一定是红线下得太乱，才不小心把我和你绑在一起了……却没系稳」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1a31feedf869","text":"你特别讨厌悲观的人，做任何事情只要出了点挫折就放弃。那是你，别自以为是把你搞得和你一样！","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1a9f4ee0d2a6","text":"你们所做的事情，不过是重复前人所做的事情罢了","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1abab4d6c1a4","text":"你在旧笔记本的扉页看到自己抄过的一句话：「荷尔蒙决定一见钟情，多巴胺决定天长地久」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1abcf8284cd9","text":"你不是在等你喜欢你，你是在等自己不喜欢你。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1acc5a392981","text":"歌单随机到一首老歌，热评第一写着：「曲高必然和寡，英雄总是孤独」。你单曲循环了一晚上。","domain":"social","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_1ae24bd4eee6","text":"你刷到一条陌生人的留言：「你看她笑靥如花，恰似此间神话」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1b190748600b","text":"你在旧笔记本的扉页看到自己抄过的一句话：「人本身可以是聚光灯，我自己可以就是发光体」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1b64c4056f00","text":"深夜的评论区里，一句话停住了你的拇指：「真正走掉那次，关门声最小」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1b7c9910458b","text":"朋友转发来一句话：「你在我规划的航程上，我在你投射的视线里」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1ba5c67a1481","text":"你们不需要死读硬记，你们需要用基本的知识来发展和增进每个学习者的思考力。","domain":"growth","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1bc225113afc","text":"歌单随机到一首老歌，热评第一写着：「你我皆为红尘客，纵断生死又如何」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1bc34f40196e","text":"你刷到一条陌生人的留言：「在太上忘情却终究人非草木」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1bdd27c05b24","text":"深夜的评论区里，一句话停住了你的拇指：「在这蛮不讲理的世界里，死亡并非解脱，我宁愿是一个瞎子，聋子，这少这样我还有一颗未洗涤过的灵魂」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1be0b9f9717d","text":"深夜的评论区里，一句话停住了你的拇指：「人这一生应当像美丽的花一样，自己无所求而却给人间以美；我们做不到所以是平凡人，他能够做到所以他是英雄」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1befa95ef2fc","text":"歌单随机到一首老歌，热评第一写着：「顺为凡，逆则仙，只在心中一念间……」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1bf86f4e068b","text":"深夜的评论区里，一句话停住了你的拇指：「亲爱的，你不是救世主」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1c089ca90af3","text":"朋友转发来一句话：「像旧时候，像老朋友」。你回了个表情，心里却记下了。","domain":"social","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1c160882d2ba","text":"你已经很乖了，自己把全部的委屈和心酸都宣泄在黑夜里。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":-3,"stress":2}},{"id":"evt_1c1de152cbea","text":"深夜的评论区里，一句话停住了你的拇指：「望如常，而非平常；知彼此，而非如此」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1c2b9bcdf3b4","text":"你刷到一条陌生人的留言：「即使被人记恨 只要各位安好 抛弃一切便好」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1c2cc56bed1c","text":"歌单随机到一首老歌，热评第一写着：「史密斯永远地躺在了那个暗无天日曾被他当作家的防空洞中」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1c3e380489da","text":"你在旧笔记本的扉页看到自己抄过的一句话：「绘守御之明信兮，书香随之丰年」，已经想不起是什么时候抄的了。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1c8d2fb7896a","text":"朋友转发来一句话：「纵深于黑夜之中化作黎明」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1cac8215456b","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「不喜欢什么都是理由，喜欢什么都不是理由」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1cb3ee45220f","text":"朋友转发来一句话：「若觉得生活索然无味，可观察时间的流逝，观察万物的轮回。观察，让人充满活力，让人珍惜现在」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1cbd6f0f9406","text":"朋友转发来一句话：「放过一场烟花，从此燃尽我一生芳华」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1cdb4445772e","text":"歌单随机到一首老歌，热评第一写着：「按下功率，轰-嚓嚓嚓」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1cf29e48ca84","text":"歌单随机到一首老歌，热评第一写着：「分手了就是分手了好聚好散大家都各自安好就好了」。你单曲循环了一晚上。","domain":"romance","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d066aef5403","text":"你刷到一条陌生人的留言：「虽然我的心脏停止跳动了，但它不会停止爱你」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d2e789653b9","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「少女躲在那棵老橡树后面/有风/白色的裙摆扬起了/少年青色的心事」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d4f0360529d","text":"深夜的评论区里，一句话停住了你的拇指：「狂喜是雨。忧愁是雨。悲剧是雨」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d6a80184e80","text":"你在旧笔记本的扉页看到自己抄过的一句话：「被关心然后关心，关心然后被关心」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d8680a60754","text":"深夜的评论区里，一句话停住了你的拇指：「剃刀边缘怎能起造伽蓝」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d8e4275de57","text":"你得罪了领导，领导醉了。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d8eeca9fd32","text":"你刷到一条陌生人的留言：「为众人抱薪者，不可使其冻毙于风雪。为自由开道者，不可令其困厄于荆棘」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1d9d8c66bde7","text":"你刷到一条陌生人的留言：「没心没肺，活着不累」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_1da396bbabaa","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「你是AI吗？回复这么简短，省算力呢」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1dacc9963e8c","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「聆听雨落的声音，俯看凋零的落叶。伫细雨之中，感雨落之殇」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1dc107b43870","text":"你穷尽了一生，也没能拯救世界。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1dd4ceb4c3de","text":"你刷到一条陌生人的留言：「一瓣人间为春困」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1dda015573ca","text":"你在旧笔记本的扉页看到自己抄过的一句话：「行百里者半九十」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1df66e6fa79c","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「既然人的尽头是死去，那人活着的意义是什么」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1dfa1e2b6e27","text":"歌单随机到一首老歌，热评第一写着：「少年总觉明日贵，却不知——今朝的笑声，才是买不回的金」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1dfed46b9ee7","text":"朋友转发来一句话：「一口饭掉一滴泪，一次咀嚼一个叹息」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e021cd0f5b7","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「也如春骄秋瑟处，胜景未在浸寒水」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e037b9a6f7c","text":"你所有的自负皆来自你的自卑，所有的英雄气概都来自于你的软弱。嘴里振振有词是因为心里满是怀疑，深情是因为痛恨自己无情。这世界没有一件事情是虚空而生的，站在光里，背后就会有阴影，这深夜里一片寂静，是因为你还没有听见声音。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e08a52d3ce7","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「做一个衣着华服时仍能做自己的人」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e2ea2d97c0d","text":"歌单随机到一首老歌，热评第一写着：「每个人的身上都有太阳，重要的是如何让它发光」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e3d83edfa2b","text":"你们遭遇了无数的傲慢与偏见。于是，你们以傲慢与偏执，回敬傲慢与偏见。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e583eba21c2","text":"你刷到一条陌生人的留言：「所为为人不指褥自耻」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1e95c54d3e1f","text":"你在旧笔记本的扉页看到自己抄过的一句话：「窗头清角残光，床头丧气萦梁。只恨眉头紧锁，无言欲堕天狼」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1edb1b4848e9","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「不相信命运却屈服于现实，拒绝眼泪却抑制不住悲伤」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1ee9764299ab","text":"你刷到一条陌生人的留言：「生死去留，棚头傀儡。一线断时，落落磊磊」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f0c7226c813","text":"朋友转发来一句话：「方生方死，方死方生，方可方不可，方不可方可」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f21363f383d","text":"你在旧笔记本的扉页看到自己抄过的一句话：「少年与爱永不老去，即便披荆斩棘，丢失怒马鲜衣」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f59eb277ece","text":"歌单随机到一首老歌，热评第一写着：「年少时，为了给你一块糖，我给遍了全班。为了探这家店，我探完了所有的店」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f6d5f16c84a","text":"朋友转发来一句话：「有人戳你脊梁，有人爱你荒唐」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f6edee08bb9","text":"你刷到一条陌生人的留言：「失落至极致，是虚无」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f72b753e25c","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「窗外花火亮起的瞬间，我为何在流泪」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f960155e3a5","text":"你在旧笔记本的扉页看到自己抄过的一句话：「搞怪的不是红绿灯，而是我数不清的犹豫」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1f961482eb8f","text":"歌单随机到一首老歌，热评第一写着：「努力没用的话，那谁还能区分天才」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1fb3515c7b42","text":"深夜的评论区里，一句话停住了你的拇指：「——什么是孤独？——心里明明空荡荡的，却什么也装不下」。","domain":"social","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_1fdff744e8c1","text":"深夜的评论区里，一句话停住了你的拇指：「真正要分开的两个人，连“分手”二字都是多余的，因为殊途同归」。","domain":"romance","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_1fe5e686f02c","text":"歌单随机到一首老歌，热评第一写着：「多少岁月与轻狂交织的梦，被遗忘在大海的尽头，随时光匆匆流去」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2032ffff3ae1","text":"你们赞叹青春好，又用余生去证明：最贵的那一天，永远是“当时只道是寻常”。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_204b275433e4","text":"歌单随机到一首老歌，热评第一写着：「恰逢昨夜寒生树，一眼扫尽满窗花」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_204c0a8e3afb","text":"歌单随机到一首老歌，热评第一写着：「站在黑暗里，连你的影子都会抛弃你」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_207859beced3","text":"你卸掉眼鏡，世界全是朦朧美！","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_20cb4a286fe4","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「于是我驻足享受无法复制的瞬间」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_20d35280e14d","text":"朋友转发来一句话：「死生，命也，其有夜旦之常，天也。人之有所不得与，皆物之情也」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_20e2d4c6b508","text":"深夜的评论区里，一句话停住了你的拇指：「读一本书，看一份风景，品一场兴衰，走一回人生」。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_20eb279fa15c","text":"朋友转发来一句话：「生命，就是幸存。幸存的表面意义是继续活着，但也是在死后活着」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_210557b98b88","text":"深夜的评论区里，一句话停住了你的拇指：「与其在家颓废，还不如多出去干点善事」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_210c8e4c0247","text":"你刷到一条陌生人的留言：「是，你是这个世界的人，但同时你要相信你创造的世界也是存在的」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_21277312c85f","text":"深夜的评论区里，一句话停住了你的拇指：「Always continue; Never break」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2149a77e9834","text":"你在旧笔记本的扉页看到自己抄过的一句话：「有意义的人等再久都有意义」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_21885ec9a6ea","text":"你在旧笔记本的扉页看到自己抄过的一句话：「是金子一定会发光，是银子一定会花光，是裙子一定会走光，是节操一定要丢光」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2199493646c7","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「为文以明心载道，为文以陶冶情操」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_21ccdef03c 你刷到一条陌生人的留言：「当你理解人性，你就理解了历史的本质」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_22b5da2112c7","text":"深夜的评论区里，一句话停住了你的拇指：「朋友，如果有一天我死了，请相信我只是去了另一个世界等你」。","domain":"social","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_22d12c11a614","text":"你刷到一条陌生人的留言：「夏天重要的事不过一二：能够静静吹风，可以好好吃饭」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_22ef87b219d0","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「对于真挚的爱意，我将永不争辩」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_22fae9a397db","text":"深夜的评论区里，一句话停住了你的拇指：「做好事不求回报，但也不要让自己吃亏」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2330e5e77fa0","text":"歌单随机到一首老歌，热评第一写着：「居其位，谋其政。上者，需以先事而后加勤；中者，先事而后为己；末者，事后闲」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_233b8b62ae5a","text":"深夜的评论区里，一句话停住了你的拇指：「本想自省，却闭门思他人之过」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_234663b50caa","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「每次对一个人很好，最后换来的不过是自己身价的卑微」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_235d24fd744c","text":"深夜的评论区里，一句话停住了你的拇指：「也许我们都没有长大，只是世界变小了」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2384fd16078a","text":"你在旧笔记本的扉页看到自己抄过的一句话：「一样花开一千年，独看沧海化桑田；一笑望穿一千年，几回知君到人间」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_238a58e59d09","text":"你刷到一条陌生人的留言：「忙碌时渴望悠闲，闲暇时却不知道干啥啦」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2390193590fd","text":"歌单随机到一首老歌，热评第一写着：「找不到自己的位置，是很可怕的事情，就好比天黑了不知道睡 isc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ae9cd30bf67","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「愿生活即使周而复始，也有意气相投的知音」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2b0740ddfc3f","text":"朋友转发来一句话：「人和人是无法理解的，所有的理解都是建立在自己的主观之上」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2b1cbf8df002","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「当人生走到了极致，才会发现原来自己所追求的只不过是生命中的那个瞬间而已」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2b469ddcaa73","text":"朋友转发来一句话：「想君眉眼起轻尘，流光驰骤追梦魂」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2b5e03b312b0","text":"你刷到一条陌生人的留言：「坚持下去，奇迹一定会发生，或许它就藏某个未发现的角落，亦或是‘放弃’这个念头的背面」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2bad1928546a","text":"歌单随机到一首老歌，热评第一写着：「以水聚思，以木筑形」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2badc38ee89d","text":"你在旧笔记本的扉页看到自己抄过的一句话：「每天早上醒来你有两个选择：一是盖上被子继续做你没做完的梦，二是掀开被子去完成你未完成的梦」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2bb27e8c3a83","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「负断只舟阡陌短，雨淋青瓦深巷中」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2bfc91935f9e","text":"朋友转发来一句话：「一朵花不必开在花园，它本身就是春天」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2bfe15f1cd17","text":"你刷到一条陌生人的留言：「青木披山岚，绿漪漾水河」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2bfe4cbcb0d5","text":"你刷到一条陌生人的留言：「知道是一个陷阱的诱惑，但偏偏乐于陷入其中，归根到底还是欲望的作祟」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c17b3085af7","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「労働者の命は何よりも大切です」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c1885c6bd3b","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「偏执于有用的细节，偏执于无用的细节，偏执于甚至不会被发现是有用还是无用的细节，这就是工匠精神」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c26b884c37a","text":"歌单随机到一首老歌，热评第一写着：「十年信奥一场空，不开long long见祖宗」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c2e8f7726a1","text":"歌单随机到一首老歌，热评第一写着：「地图上，指尖微动便可跨越万里，如果回家如这般容易，又岂会有乡愁记叙」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c31f5636d57","text":"你在旧笔记本的扉页看到自己抄过的一句话：「追逐了百年的太阳，却忘了月亮也是独一无二了的」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c37823fbf29","text":"你在旧笔记本的扉页看到自己抄过的一句话：「想君眉眼起轻尘」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c4c2b0887e8","text":"你在旧笔记本的扉页看到自己抄过的一句话：「可是啊，儿时坚定而稚嫩的梦，终究没能挺过青春的风」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c4fdf671a1d","text":"朋友转发来一句话：「很多事情犹如天气，慢慢热或是渐渐冷，等到惊悟的时候，已过了一季」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c591871cbc4","text":"你刷到一条陌生人的留言：「都是同龄人，我本来没想降维打击」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2c6ef107d93f","text":"深夜的评论区里，一句话停住了你的拇指：「永远不要放弃你真正想要得到的东西，等待虽难，但后悔更甚」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":-3,"stress":2}},{"id":"evt_2c759489fa90","text":"深夜的评论区里，一句话停住了你的拇指：「眼睛是心灵的窗户」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2cbe99602ee7","text":"你刷到一条陌生人的留言：「给予的希望不要让其轻易破灭。毕竟没到最后，一切都还在进行中。而，结束在什么时刻，谁又说的定。若放弃了，那才是真正结束」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2cc4d4ed93fb","text":"你从不相信这世界上有什么天赋异禀。那些看起来超乎寻常的人，总有你没看到的一面。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2cd73aaa8746","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「所有的偶然，不过是想要遇见你」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ce04b8ace59","text":"朋友转发来一句话：「被风吹散的思念，卷起不羁的时间」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ce674b38ec1","text":"朋友转发来一句话：「游心于淡，合气于漠，顺物自然而无容私焉」。你回了个表情，心里却记下了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2cf48d528c72","text":"你希望庆国之民，有真理可循，知礼仪，守仁心，不以钱财论成败，不因权势而屈从，同情弱小，痛恨不平，危难时坚心志，无人处常自省；你希望这世间，再无压迫束缚，凡生于世，都能有活着的权利，有自由的权利，亦有幸福的权利。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":3,"stress":-2}},{"id":"evt_2cf6434feede","text":"深夜的评论区里，一句话停住了你的拇指：「如果忘记你那么容易，那我爱你干嘛」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2d1227977736","text":"你在旧笔记本的扉页看到自己抄过的一句话：「远赴人间惊鸿宴，一睹大唐盛世颜」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2d142db7d6ab","text":"你刷到一条陌生人的留言：「尘染梧桐穿叶落，暖春秋色是人寰」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2d72c60fd486","text":"你在旧笔记本的扉页看到自己抄过的一句话：「团雀闹，好事近」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2d885bdd3695","text":"你们活在三维空间，你们生存在这个世界 ，但你们最终活成的都是你们自己的位面体。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2d944c06dd4d","text":"你是说，一个人的生命就像一副充满了点数是所谓“X”的牌堆，只要牌堆还没见底，你就能根据运气与先天条件推导排列出最优选择。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2d9a3eecf9d8","text":"你刷到一条陌生人的留言：「三万年的距离，也不及你我的爱河」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2da5fe8039b6","text":"你刷到一条陌生人的留言：「如果你也有还未做完的梦，还请将它撒入这片星河」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ddb74892bc1","text":"你在旧笔记本的扉页看到自己抄过的一句话：「无论撒怎样的谎，都无法欺骗自己的心」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2deaa7e0e4c8","text":"你在旧笔记本的扉页看到自己抄过的一句话：「保持热爱，奔赴山海」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2dfc58ebb312","text":"歌单随机到一首老歌，热评第一写着：「皱纹是时间吹过身体时泛起的涟漪」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2e19be263856","text":"歌单随机到一首老歌，热评第一写着：「最简单的，有的人认为人活着就是为了吃饭，有的人是为了吃饭而活着」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2e1b2dc87e50","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「喜欢大胸只是本能，喜欢贫乳才是审美」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2e2afc71a894","text":"你在旧笔记本的扉页看到自己抄过的一句话：「如人间过客，总追着虚无漂泊」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2e5234a3cb47","text":"你本将心向明月，奈何明月照沟渠。落花有意随流水，流水无心恋落花。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2e763e0344a2","text":"你刷到一条陌生人的留言：「如果你不能给她穿上嫁衣，请停下脱她衣服的手」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2e783dbb27e3","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「知君肝胆昭昭印刻前文」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ed4d8f06c98","text":"你们站在去与来的中间，你们告别过去，你们追逐明天。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ed558a80005","text":"你在旧笔记本的扉页看到自己抄过的一句话：「小时候，我妈说我的手指长，将来能当钢琴家，然后我成了码农」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ee4d1542756","text":"你在旧笔记本的扉页看到自己抄过的一句话：「哼！悔改吧，你们这群死宅，人家可是身价四千万的大小姐」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ef10641eaac","text":"歌单随机到一首老歌，热评第一写着：「真理是普遍的，它不属于我一个人，而为大家所有；真理占有我，而不是我占有真理。我只有构成我的精神个性的形式」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2ef6a857781d","text":"你们的科学永远只是找到近似真理。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2efe011b0c07","text":"歌单随机到一首老歌，热评第一写着：「无论在多不幸的状况下，只要相信自己是幸福的，就能得到幸福」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_2f0626c9d200","text":"你在旧笔记本的扉页看到自己抄过的一句话：「去你的城市，路过你熟悉的街，吃你以前常对我讲的街角的那家小吃，坐在图书馆的楼梯上，一个像极你的背影。路过，边上那人，叫着曾经熟悉的名字，我知道我该回家了」，已经想不起是什么时候抄的了。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f0bde167392","text":"你在旧笔记本的扉页看到自己抄过的一句话：「若不追忆，则从此听不到那年华里，谁的叹息」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f0d846060b2","text":"你想任性要一回自由。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f14781e1965","text":"歌单随机到一首老歌，热评第一写着：「在这个世界上，失恋了就失恋了。反正没有比我更爱你的人。以前是，现在是，将来不是了」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f324727d0ce","text":"你在旧笔记本的扉页看到自己抄过的一句话：「即便是一个毫无存在感的影子，也应当寸步不离自己的目标步步前进」，已经想不起是什么时候抄的了。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f3330fed4a6","text":"歌单随机到一首老歌，热评第一写着：「放下的过程很难，但是结束的来临很快」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f55c52dd24a","text":"你刷到一条陌生人的留言：「有一种无奈叫做，你明明是只候鸟，却喜欢上只能给你冬天的人」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f5f0c5471d6","text":"你刷到一条陌生人的留言：「节日的意义，就是用美好的方式消耗时间」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_2f69c98139e4","text":"深夜的评论区里，一句话停住了你的拇指：「科研成就的上限在于你的想象力」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f7e3fe6a1e8","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「这个世界的人都渐渐变得寂寞，大城市没有邻里之喜，只有小家的柴米油盐」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2f9ea838816d","text":"你很少回忆，却不代表那些过往不在。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2fb2d9ded6d3","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「孩子们玩耍，双脚全是沙」。到站了你还在想。","domain":"family","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2fdf20a63e3d","text":"歌单随机到一首老歌，热评第一写着：「慢也好，步伐小也罢，是往前走就好」。你单曲循环了一晚上。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_2fdf3c7ab40c","text":"你这个人虐点特别奇怪：不怕死不怕残，但你怕看见诚实的人被迫说谎；正直的人被迫弯腰；痴情的人变得薄情冷漠；直言者被迫噤声；理想主义者亲眼见到理想破碎。谎话连篇者最后的一句真话；奴颜婢膝者最后挺直了腰杆；缄口自保者突然仗义执言；曾遭理想背叛的人最后选择为理想而死。","domain":"misc","min_age":16,"max_age":75,"weight":1.0,"effects":{"happiness":0,"stress":1}},{"id":"evt_2fe3b6c75e59","text":"地铁上你瞥见邻座手机屏幕上的一句签名：「如果遇到爱的人，请拉紧她的手」。到站了你还在想。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_302870716b63","text":"你刷到一条陌生人的留言：「他们不配做知己，不必有结局」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_30364a8dd497","text":"深夜的评论区里，一句话停住了你的拇指：「若挥袖作别，流云万千，可有人千万流连。 若今昔一别，一别永年，苍山负雪，浮生尽歇」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_3042104adf84","text":"你刷到一条陌生人的留言：「醒来的时候很困，要睡了的时候很精神」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_30597309ceeb","text":"深夜的评论区里，一句话停住了你的拇指：「为中华之崛起而读书，为肩宽窄腰男人而奋斗」。","domain":"growth","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_3066109c2c92","text":"你刷到一条陌生人的留言：「云淡淡天很蓝思绪慢慢走远，春光细细流淌幸福漫过指尖」，恍惚间想到了自己的生活。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":3,"stress":-2}},{"id":"evt_306a916ca110","text":"深夜的评论区里，一句话停住了你的拇指：「就算未曾拥有，也要满怀期待」。","domain":"misc","min_age":16,"max_age":75,"weight":0.15,"effects":{"happiness":0,"stress":1}},{"id":"evt_hm_001","text":"深夜加完班走出写字楼，你发现路边摊的烤红薯和二十年前老家门口的一个味道。","domain":"career","min_age":22,"max_age":45,"weight":1.0,"effects":{"happiness":3}},{"id":"evt_hm_002","text":"部门空降了一位新领导，把你负责了两年的项目整个推翻重来。","domain":"career","min_age":24,"max_age":55,"weight":1.0,"effects":{"happiness":-4,"stress":8}},{"id":"evt_hm_003","text":"你带的实习生第一次独立完成任务后，特地跑来向你道谢。你忽然理解了当年前辈看你的眼神。","domain":"career","min_age":26,"max_age":55,"weight":0.8,"trait_bias":{"A":0.4},"effects":{"happiness":5}},{"id":"evt_hm_004","text":"一个猎头突然打来电话，报出的数字让你心跳漏了一拍。你在地铁上想了一路。","domain":"career","min_age":25,"max_age":45,"weight":1.0,"trait_bias":{"O":0.3},"effects":{"stress":3}},{"id":"evt_hm_005","text":"年会抽奖你中了最大的奖，同事起哄让你请客，热闹了一整晚。","domain":"career","min_age":22,"max_age":60,"weight":0.6,"trait_bias":{"E":0.3},"effects":{"happiness":4}},{"id":"evt_hm_010","text":"你在老同学的婚礼上被安排在'单身桌'，一桌人尴尬地互相敬酒。","domain":"romance","min_age":24,"max_age":40,"weight":0.8,"effects":{"happiness":-3}},{"id":"evt_hm_011","text":"前任在朋友圈晒出了婚纱照。你盯着看了十秒，点了个赞，又默默取消了。","domain":"romance","min_age":22,"max_age":45,"weight":0.8,"trait_bias":{"N":0.4},"effects":{"happiness":-4,"stress":4}},{"id":"evt_hm_012","text":"你和伴侣为了'谁忘了倒垃圾'大吵一架，最后却因为吵得太离谱笑作一团。","domain":"romance","min_age":22,"max_age":70,"weight":1.0,"effects":{"happiness":3,"stress":-2}},{"id":"evt_hm_013","text":"长辈又一次在饭桌上问起你的感情状况，你笑着扒饭，把话题岔了过去。","domain":"romance","min_age":24,"max_age":40,"weight":1.0,"effects":{"stress":4}},{"id":"evt_hm_020","text":"父亲的白头发好像一夜之间多了很多。视频通话里他还是那句'家里都好，别担心'。","domain":"family","min_age":25,"max_age":60,"weight":1.2,"effects":{"happiness":-3}},{"id":"evt_hm_021","text":"收拾旧物时翻出小学的日记本，里面写着'长大以后一定要……'。你合上本子坐了很久。","domain":"family","min_age":25,"max_age":70,"weight":0.8,"trait_bias":{"O":0.3},"effects":{"happiness":2}},{"id":"evt_hm_022","text":"母亲学会了发语音红包，逢年过节准时发来八块八，附一句'注意身体'。","domain":"family","min_age":22,"max_age":60,"weight":1.0,"effects":{"happiness":4}},{"id":"evt_hm_023","text":"家族群里因为一条养生谣言吵了起来，你打了一大段科普又逐字删掉了。","domain":"family","min_age":20,"max_age":60,"weight":0.8,"trait_bias":{"A":-0.3},"effects":{"stress":2}},{"id":"evt_hm_024","text":"孩子第一次开口叫你，你愣了两秒，眼眶一下就热了。","domain":"family","min_age":24,"max_age":45,"weight":1.0,"effects":{"happiness":8}},{"id":"evt_hm_030","text":"体检报告上多了两个箭头。你把'规律作息'四个字写进了新年计划——第三次。","domain":"health","min_age":26,"max_age":60,"weight":1.2,"effects":{"stress":4}},{"id":"evt_hm_031","text":"你连续跑步满一百天，体重没怎么变，但爬六楼不喘了。","domain":"health","min_age":18,"max_age":65,"weight":0.8,"trait_bias":{"C":0.5},"effects":{"happiness":4,"health":3,"stress":-3}},{"id":"evt_hm_032","text":"一场重感冒把你击倒在出租屋里，你烧得迷迷糊糊，第一次认真想到了'一个人'这件事。","domain":"health","min_age":20,"max_age":40,"weight":0.8,"effects":{"happiness":-4,"health":-2}},{"id":"evt_hm_033","text":"你尝试冥想来对抗失眠，结果在第三分钟睡着了。也算成功。","domain":"health","min_age":20,"max_age":70,"weight":0.6,"trait_bias":{"N":0.4},"effects":{"stress":-4}},{"id":"evt_hm_040","text":"房东通知涨租的那天，你打开了买房计算器，按了几下又默默关掉。","domain":"finance","min_age":22,"max_age":40,"weight":1.0,"effects":{"happiness":-3,"stress":5}},{"id":"evt_hm_041","text":"你尘封多年的旧手办在二手平台意外卖出了高价，够吃一个月的午饭。","domain":"finance","min_age":18,"max_age":45,"weight":0.6,"effects":{"happiness":3,"wealth":5}},{"id":"evt_hm_042","text":"你跟风买的基金绿了一整年，你决定把 App 卸载，眼不见心不烦。","domain":"finance","min_age":22,"max_age":55,"weight":0.8,"effects":{"happiness":-2,"wealth":-5}},{"id":"evt_hm_043","text":"你第一次认真记账，月底看到'奶茶'分类的总额时沉默了。","domain":"finance","min_age":18,"max_age":40,"weight":0.8,"trait_bias":{"C":0.3},"effects":{"stress":1}},{"id":"evt_hm_050","text":"你报名的线上课程终于学完了最后一节。结业证书是电子的，成就感是真实的。","domain":"growth","min_age":18,"max_age":60,"weight":0.8,"trait_bias":{"C":0.4,"O":0.3},"effects":{"happiness":4}},{"id":"evt_hm_051","text":"你在书店站着读完了一本书的一半，最后还是把它买了下来——为了另一半。","domain":"growth","min_age":15,"max_age":75,"weight":0.8,"trait_bias":{"O":0.5},"effects":{"happiness":3}},{"id":"evt_hm_052","text":"你心血来潮学做一道硬菜，厨房像被打劫过，但味道意外地不错。","domain":"growth","min_age":18,"max_age":70,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_053","text":"深夜你把学了三个月的吉他弹给自己听，跑调跑得很自由。","domain":"growth","min_age":15,"max_age":60,"weight":0.6,"trait_bias":{"O":0.4},"effects":{"happiness":3,"stress":-2}},{"id":"evt_hm_060","text":"多年没联系的好友突然发来消息：'在吗，路过你的城市，见一面？'你们聊到了打烊。","domain":"social","min_age":20,"max_age":70,"weight":1.0,"trait_bias":{"E":0.3},"effects":{"happiness":5}},{"id":"evt_hm_061","text":"你被拉进了第七个工作群。你把手机调成静音，世界清净了三分钟。","domain":"social","min_age":22,"max_age":55,"weight":0.8,"trait_bias":{"E":-0.4},"effects":{"stress":3}},{"id":"evt_hm_062","text":"小区楼下的流浪猫开始蹭你的裤脚。你顺手买了猫粮，从此多了一份'责任'。","domain":"social","min_age":15,"max_age":80,"weight":0.8,"trait_bias":{"A":0.4},"effects":{"happiness":4}},{"id":"evt_hm_063","text":"你鼓起勇气参加了一场陌生人饭局，全程话不多，但回家路上觉得没那么孤单了。","domain":"social","min_age":18,"max_age":50,"weight":0.6,"trait_bias":{"E":-0.3},"effects":{"happiness":3}},{"id":"evt_hm_070","text":"你在阳台种的小番茄结果了，一共三颗。你郑重其事地拍照留念。","domain":"misc","min_age":18,"max_age":90,"weight":0.8,"effects":{"happiness":3}},{"id":"evt_hm_071","text":"台风夜停电，你点着手机手电筒吃泡面，忽然觉得这一刻也挺浪漫。","domain":"misc","min_age":15,"max_age":80,"weight":0.6,"effects":{"happiness":2}},{"id":"evt_hm_072","text":"你错过了末班车，步行四十分钟回家，路上把这几年的事想了一遍。","domain":"misc","min_age":18,"max_age":60,"weight":0.8,"effects":{"stress":-2}},{"id":"evt_hm_073","text":"手机相册自动生成了'五年前的今天'。你看着照片里的自己，一时说不清是怀念还是感慨。","domain":"misc","min_age":22,"max_age":80,"weight":0.8,"effects":{"happiness":1}},{"id":"evt_hm_074","text":"你在旧衣服口袋里摸出一张没刮的彩票。刮开：谢谢惠顾。你笑了一下，扔进了垃圾桶。","domain":"misc","min_age":18,"max_age":80,"weight":0.6},{"id":"evt_hm_080","text":"凌晨三点你还清醒着，给自己列了一张'三十岁之前要做的事'清单，然后安心睡去。","domain":"growth","min_age":20,"max_age":29,"weight":0.8,"trait_bias":{"C":0.3,"N":0.2},"effects":{"stress":-2}},{"id":"evt_hm_081","text":"你参加了人生第一场马拉松，在最后一公里几乎是走过终点的，但奖牌货真价实。","domain":"health","min_age":18,"max_age":55,"weight":0.6,"trait_bias":{"C":0.4,"E":0.2},"effects":{"happiness":6,"health":2}},{"id":"evt_hm_082","text":"退休后的第一个工作日早晨，你习惯性地七点醒来，然后想起不用上班，又幸福地睡了回去。","domain":"career","min_age":60,"max_age":75,"weight":1.0,"effects":{"happiness":5,"stress":-5}},{"id":"evt_hm_083","text":"你开始教社区的老人用智能手机，他们叫你'小老师'，虽然你也不年轻了。","domain":"social","min_age":45,"max_age":80,"weight":0.8,"trait_bias":{"A":0.4},"effects":{"happiness":5}},{"id":"evt_hm_084","text":"孙辈拿着作业来问你问题，你偷偷在另一个房间搜索了答案，保住了长辈的威严。","domain":"family","min_age":55,"max_age":90,"weight":0.8,"effects":{"happiness":5}},{"id":"evt_hm_085","text":"高中晚自习停电的那晚，整栋楼的人在黑暗里欢呼。多年后你还会想起那片星星点点的手机光。","domain":"growth","min_age":15,"max_age":19,"weight":0.8,"effects":{"happiness":4}},{"id":"evt_hm_100","text":"早高峰的地铁把你挤成了一张纸，到公司才发现工牌反着挂了一上午。","domain":"career","min_age":22,"max_age":55,"weight":0.8,"effects":{"stress":2}},{"id":"evt_hm_101","text":"你在例会上鼓起勇气提了个想法，居然被采纳了。散会后你在工位上偷偷握了下拳。","domain":"career","min_age":22,"max_age":50,"weight":0.8,"trait_bias":{"E":-0.2},"effects":{"happiness":5}},{"id":"evt_hm_102",
